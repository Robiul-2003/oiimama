<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
  body { 
    background:#f0f2f5; 
    height:100vh; 
    display:flex; 
    justify-content: center;
  }

  /* পুরো চ্যাট সেকশনটি ধরে রাখার জন্য মেইন কন্টেইনার */
  .chat-container {
    width: 100%;
    max-width: 800px;
    height: 100%;
    background: #ece5dd;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }

  .chat-header {
    background:#042867; color:#fff; padding:12px 16px;
    display:flex; align-items:center; gap:10px;
  }
  .chat-header .back { font-size:22px; cursor:pointer; }
  .chat-header .info h4 { font-size:16px; }
  .chat-header .info p { font-size:12px; opacity:.8; }

  .product-bar {
    background:#fff; padding:8px 12px; display:flex; gap:10px;
    align-items:center; border-bottom:1px solid #ddd;
  }
  .product-bar img { width:40px; height:40px; border-radius:6px; object-fit:cover; }
  .product-bar span { font-size:13px; color:#333; }

  #messages {
    flex:1; overflow-y:auto; padding:12px; background:#ece5dd;
  }

  .msg {
    max-width:75%; padding:8px 12px; border-radius:10px;
    margin-bottom:8px; font-size:14px; word-wrap:break-word;
    clear:both;
  }
  .msg.me { background:#dcf8c6; margin-left:auto; }
  .msg.other { background:#fff; margin-right:auto; }
  .msg .time { font-size:10px; color:#666; text-align:right; margin-top:4px; }

  .input-area {
    display:flex; padding:8px; background:#fff; border-top:1px solid #ddd;
  }
  .input-area input {
    flex:1; padding:10px; border:1px solid #ccc; border-radius:20px;
    outline:none; font-size:14px;
  }
  .input-area button {
    margin-left:8px; padding:0 18px; border:none; border-radius:20px;
    background:#042867; color:#fff; font-size:16px; cursor:pointer;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <span class="back" onclick="history.back()">←</span>
    <div class="info">
      <h4 id="chatName">Loading...</h4>
      <p id="chatStatus">online</p>
    </div>
  </div>

  <div class="product-bar" id="productBar"></div>

  <div id="messages"></div>

  <div class="input-area">
    <input id="msgInput" placeholder="Type a message..." autocomplete="off">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, collection, addDoc, doc, getDoc, setDoc,
  serverTimestamp, query, orderBy, onSnapshot, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB9Ed_6mJEZ_fhITCrf-d9P6KlgpQBLD14",
  authDomain: "robiul-84377.firebaseapp.com",
  projectId: "robiul-84377",
  storageBucket: "robiul-84377.firebasestorage.app",
  messagingSenderId: "476907665212",
  appId: "1:476907665212:web:b4dc619f0290a2241b1039"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const params  = new URLSearchParams(location.search);
const chatId  = params.get("chatId");

let currentUser = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = "login.html"; return; }
  currentUser = user;
  await loadChatInfo();
  listenMessages();
});

async function loadChatInfo() {
  const chatSnap = await getDoc(doc(db, "chats", chatId));
  if (!chatSnap.exists()) return;

  const data = chatSnap.data();
  const otherUid = data.members.find(uid => uid !== currentUser.uid);
  const other = data.membersInfo?.[otherUid];

  document.getElementById("chatName").innerText = other?.name || "User";

  if (data.productName) {
    document.getElementById("productBar").innerHTML = `
      <img src="${data.productImage || 'logo.png'}">
      <span>${data.productName}</span>
    `;
  }

  if (data.lastMessage === "") {
    await addDoc(collection(db, "chats", chatId, "messages"), {
      sender: currentUser.uid,
      text: `Hi, "${data.productName}" নিয়ে কথা বলতে চাই।`,
      time: serverTimestamp(),
      seen: false
    });
  }
}

function listenMessages() {
  const q = query(
    collection(db, "chats", chatId, "messages"),
    orderBy("time", "asc")
  );

  onSnapshot(q, (snap) => {
    const box = document.getElementById("messages");
    box.innerHTML = "";

    snap.forEach(docSnap => {
      const m = docSnap.data();
      const isMe = m.sender === currentUser.uid;
      const time = m.time?.toDate 
        ? m.time.toDate().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
        : "now";

      box.innerHTML += `
        <div class="msg ${isMe ? 'me' : 'other'}">
          ${escapeHtml(m.text)}
          <div class="time">${time}</div>
        </div>
      `;
    });

    box.scrollTop = box.scrollHeight;
  });
}

window.sendMessage = async function () {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";

  await addDoc(collection(db, "chats", chatId, "messages"), {
    sender: currentUser.uid,
    text,
    time: serverTimestamp(),
    seen: false
  });

  await updateDoc(doc(db, "chats", chatId), {
    lastMessage: text,
    lastTime: serverTimestamp()
  });
};

document.getElementById("msgInput").addEventListener("keypress", e => {
  if (e.key === "Enter") sendMessage();
});

function escapeHtml(str) { 
  return String(str).replace(/[&<>"']/g, s => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[s]));
}
</script>
</body>
</html>
