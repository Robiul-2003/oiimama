<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
  body { 
    background:#f0f2f5; 
    height:100vh; 
    display:flex; 
    justify-content: center;
  }
  .chat-container {
    width: 100%;
    max-width: 800px;
    height: 100%;
    background: #ece5dd;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  .chat-header {
    background:#042867; color:#fff; padding:12px 16px;
    display:flex; align-items:center; gap:10px;
  }
  .chat-header .back { font-size:22px; cursor:pointer; }
  .chat-header .info h4 { font-size:16px; }
  .chat-header .info p { font-size:12px; opacity:.8; }

  .product-bar {
    background:#fff; padding:8px 12px; display:flex; gap:10px;
    align-items:center; border-bottom:1px solid #ddd;
  }
  .product-bar img { width:40px; height:40px; border-radius:6px; object-fit:cover; }
  .product-bar span { font-size:13px; color:#333; }

  #messages {
    flex:1; overflow-y:auto; padding:12px; background:#ece5dd;
  }

  .msg {
    max-width:75%; padding:8px 12px; border-radius:10px;
    margin-bottom:8px; font-size:14px; word-wrap:break-word;
    clear:both;
  }
  .msg.me { background:#dcf8c6; margin-left:auto; }
  .msg.other { background:#fff; margin-right:auto; }
  .msg .time { font-size:10px; color:#666; text-align:right; margin-top:4px; }

  .input-area {
    display:flex; padding:8px; background:#fff; border-top:1px solid #ddd;
  }
  .input-area input {
    flex:1; padding:10px; border:1px solid #ccc; border-radius:20px;
    outline:none; font-size:14px;
  }
  .input-area button {
    margin-left:8px; padding:0 18px; border:none; border-radius:20px;
    background:#042867; color:#fff; font-size:16px; cursor:pointer;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <span class="back" onclick="history.back()">←</span>
    <div class="info">
      <h4 id="chatName">Loading...</h4>
      <p id="chatStatus">online</p>
    </div>
  </div>

  <div class="product-bar" id="productBar"></div>

  <div id="messages"></div>

  <div class="input-area">
    <input id="msgInput" placeholder="Type a message..." autocomplete="off">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  doc,
  getDoc,
  serverTimestamp,
  query,
  orderBy,
  onSnapshot,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB9Ed_6mJEZ_fhITCrf-d9P6KlgpQBLD14",
  authDomain: "robiul-84377.firebaseapp.com",
  projectId: "robiul-84377",
  storageBucket: "robiul-84377.firebasestorage.app",
  messagingSenderId: "476907665212",
  appId: "1:476907665212:web:b4dc619f0290a2241b1039"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const chatId = params.get("chatId");

let currentUser = null;
let receiverUid = null;
let messagesUnsubscribe = null;
let sending = false;

if (!chatId) {
  alert("Chat ID পাওয়া যায়নি।");
  location.href = "message.html";
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = "login.html";
    return;
  }

  currentUser = user;

  try {
    await loadChatInfo();
    if (!receiverUid) return;

    await markAsRead();
    listenMessages();
  } catch (error) {
    console.error("Chat loading error:", error);
    alert("Chat লোড করা যায়নি। আবার চেষ্টা করো।");
  }
});

// --------------------
// Chat information
// --------------------
async function loadChatInfo() {
  const chatRef = doc(db, "chats", chatId);
  const chatSnap = await getDoc(chatRef);

  if (!chatSnap.exists()) {
    throw new Error("Chat document পাওয়া যায়নি");
  }

  const data = chatSnap.data();

  if (!Array.isArray(data.members) ||
      !data.members.includes(currentUser.uid)) {
    throw new Error("তুমি এই chat-এর member নও");
  }

  receiverUid = data.members.find(
    uid => uid !== currentUser.uid
  );

  if (!receiverUid) {
    throw new Error("Receiver UID পাওয়া যায়নি");
  }

  const other = data.membersInfo?.[receiverUid] || {};

  document.getElementById("chatName").textContent =
    other.name || "User";

  const productBar = document.getElementById("productBar");
  productBar.replaceChildren();

  if (data.productName) {
    const image = document.createElement("img");
    image.src = data.productImage || "logo.png";
    image.alt = data.productName;

    const title = document.createElement("span");
    title.textContent = data.productName;

    productBar.append(image, title);
  }
}

// --------------------
// Mark this user's chat as read
// --------------------
async function markAsRead() {
  if (!currentUser || !chatId) return;

  await updateDoc(doc(db, "chats", chatId), {
    [`unreadCount.${currentUser.uid}`]: 0
  });
}

// --------------------
// Listen to messages
// --------------------
function listenMessages() {
  if (messagesUnsubscribe) {
    messagesUnsubscribe();
  }

  const messagesQuery = query(
    collection(db, "chats", chatId, "messages"),
    orderBy("time", "asc")
  );

  messagesUnsubscribe = onSnapshot(
    messagesQuery,
    (snapshot) => {
      const box = document.getElementById("messages");
      box.replaceChildren();

      snapshot.forEach((messageDoc) => {
        const message = messageDoc.data();
        const bubble = document.createElement("div");

        bubble.className =
          "msg " +
          (message.sender === currentUser.uid ? "me" : "other");

        bubble.appendChild(
          document.createTextNode(message.text || "")
        );

        const time = document.createElement("div");
        time.className = "time";
        time.textContent = message.time?.toDate
          ? message.time.toDate().toLocaleTimeString([], {
              hour: "2-digit",
              minute: "2-digit"
            })
          : "now";

        bubble.appendChild(time);
        box.appendChild(bubble);
      });

      box.scrollTop = box.scrollHeight;
    },
    (error) => {
      console.error("Message listener error:", error);
    }
  );
}

// --------------------
// Send message
// --------------------
window.sendMessage = async function () {
  if (!currentUser || !receiverUid || sending) return;

  const input = document.getElementById("msgInput");
  const text = input.value.trim();

  if (!text) return;

  sending = true;
  input.disabled = true;

  try {
    const chatRef = doc(db, "chats", chatId);

    // Ensure the chat document still exists.
    const chatSnap = await getDoc(chatRef);

    if (!chatSnap.exists()) {
      throw new Error("Chat পাওয়া যায়নি");
    }

    const members = chatSnap.data().members || [];

    if (!members.includes(receiverUid)) {
      throw new Error("Receiver এই chat-এর member নন");
    }

    // Increment receiver's unread count and update preview.
    // This update happens only after a message is saved.
    await addDoc(
      collection(db, "chats", chatId, "messages"),
      {
        sender: currentUser.uid,
        text: text,
        time: serverTimestamp(),
        seen: false
      }
    );

 if (!receiverUid) {
  console.error("Receiver UID পাওয়া যায়নি");
  return;
}

await updateDoc(doc(db, "chats", chatId), {
  lastMessage: text,
  lastTime: serverTimestamp(),
  [`unreadCount.${receiverUid}`]: increment(1)
});

console.log("Unread count increased for:", receiverUid);

    input.value = "";
  } catch (error) {
    console.error("Send message error:", error);
    alert("মেসেজ পাঠানো যায়নি। আবার চেষ্টা করো।");
  } finally {
    sending = false;
    input.disabled = false;
    input.focus();
  }
};

// Send with Enter
document.getElementById("msgInput").addEventListener(
  "keydown",
  (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      window.sendMessage();
    }
  }
);

window.addEventListener("pagehide", () => {
  if (messagesUnsubscribe) {
    messagesUnsubscribe();
  }
});
</script>
</body>
</html>
