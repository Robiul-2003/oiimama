<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<title>Messages</title>
<style>
  body { font-family:sans-serif; background:#e5e7ea; margin:0; }
  .header1 { max-width:1000px; margin:auto; background:white; border-bottom:1px solid rgb(239, 234, 234); }
  .headone { justify-content: space-between; align-items: center; display: flex; }
  .name{ font-size:23px;  padding-top:10px;  color:#031f50; font-weight:bold;  cursor:pointer; }
  .fa-list { font-size:20px; margin-right:5%; cursor: pointer; }
  .headtwo { height:50px; display:flex; align-items:center; margin-top:0; }
  
  #homeimg { width: 35px; height: 28px; margin-left: 2%; cursor: pointer; }
  #pentoimg { width: 32px; height: 30px; margin-left:12%; cursor: pointer; }
  #videoimg { width: 36px; height: 32px; margin-left:20%; cursor: pointer; }
  #bellimg { width: 30px; height: 30px; margin-left: auto; margin-right:12%; cursor: pointer; }
  #userimg { width: 28px; height: 28px; margin-right: 2%; cursor: pointer; }

  .msg-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 50px;
    background-color:white;
    border-radius: 50%;
    margin-left: 12%;
    cursor: pointer;
  }
  
  .msg-wrap #messageimg { 
    width: 35px; 
    height: 30px; 
    margin: 0; 
    
  }
  
  .msg-badge {
    position: absolute;
    top: -2px;
    right: -4px;
    background: #e41e3f;
    color: #fff;
    font-size: 11px;
    font-weight: bold;
    min-width: 20px;
    height: 20px;
    border-radius: 10px;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    border: 2px solid #fff;
    box-sizing: border-box;
    line-height: 1;
  }

  .chat-item { max-width:975px; margin:auto; background:#fff; padding:12px; display:flex; gap:12px; border-bottom:1px solid rgb(239, 234, 234); cursor:pointer; align-items: center; }
  .chat-item img { width:35px; height:35px; border-radius:50%; object-fit:cover;}
  .chat-item .info { flex:1; }
  .chat-item .info h4 { margin:0; font-size:15px; }
  .chat-item .info p { margin:4px 0 0; font-size:13px; color:#666; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px;}
  
  .chat-item .time { font-size:11px; color:#999; }
  .chat-item .time.unread-time { color: #e41e3f; font-weight: bold; }

  /* 🔴 আনরিড মেসেজের লাল ডট */
  .red-dot {
    width: 9px;
    height: 9px;
    background-color: #e41e3f;
    border-radius: 50%;
    display: inline-block;
    margin-top: 5px;
  }

  @media(max-width:600px){
  .name {font-family: "Open Sans", sans-serif; font-size: 20px; font-weight: 700; margin-left: 4%;  margin-top: 0px;  color: #031f50; }
  #homeimg {  width: 35px;  height: 25px;   margin-left: 3%; }
  #pentoimg {  width: 32px;  height: 28px; margin-left: 8%;}
  #messageimg { width: 30px; height: 28px; margin-left: 8%;}
  #videoimg { width: 35px; height: 32px;   margin-left: 8%; }
  #bellimg {width: 29px;  height: 29px; margin-left: auto;  margin-right: 1%;}
  #userimg { width: 25px; height: 25px; margin-left: auto;  margin-right: 4%;}
    .msg-wrap { margin-left: 10%; }
  }
</style>
</head>
<body>
  <div class="header1">
    <div class="headone">
      <span class="name">ADARSHA</span>
      <i class="fa-solid fa-list" onclick="window.location.href='list.html'" id="list"></i>
    </div>
    <div class="headtwo">
      <img src="home.png" id="homeimg" onclick="window.location.href='index.html'">
      <img src="pento.png" id="pentoimg" onclick="window.location.href='post.html'">

      <div class="msg-wrap" onclick="window.location.href='message.html'">
        <img src="message.png" id="messageimg">
        <span class="msg-badge" id="msgBadge">0</span>
      </div>

      <img src="VIDEO.png" id="videoimg" onclick="window.location.href='vedio.html'">
      <img src="bell.png" id="bellimg">
      <img src="user.png" id="userimg" onclick="window.location.href='user.html'">
    </div>
  </div>

<div id="chatList"></div>
<script type="module" src="sobiconmassage.js"></script>
</body>
</html>
