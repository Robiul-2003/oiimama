<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<title>Messages</title>
<style>
  body { font-family:sans-serif; background:#e5e7ea; margin:0; }
   .header1{
    max-width:1000px;margin:auto;background:white;border-bottom:1px solid rgb(239, 234, 234);
   }
   .headone {
  justify-content: space-between;
  align-items: center;
  display: flex;
}
    .name { font-size: 20px; padding: 10px; color: #031f50; font-weight: bold; cursor: pointer; }
    .fa-list{ font-size:20px;margin-right:5%; }
     .headtwo{
     height:50px;
        display:flex;
        align-items:center;
        margin-top:0;
    }
            #homeimg { width: 35px; height: 28px; margin-left: 2%; }
            #pentoimg, #messageimg { width: 32px; height: 30px; margin-left:12%; }
            #videoimg { width: 36px; height: 32px; margin-left:20%; }
            #bellimg { width: 30px; height: 30px; margin-left: auto; margin-right:12%; }
            #userimg { width: 28px; height: 28px; margin-right: 2%; }

  .chat-item {
    max-width:975px;margin:auto;
    background:#fff; padding:12px; display:flex; gap:12px;
    border-bottom:1px solid rgb(239, 234, 234); cursor:pointer;
  }
  .chat-item img { width:35px; height:35px; border-radius:50%; object-fit:cover;}
  .chat-item .info { flex:1; }
  .chat-item .info h4 { margin:0; font-size:15px; }
  .chat-item .info p { margin:4px 0 0; font-size:13px; color:#666;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px;}
  .chat-item .time { font-size:11px; color:#999; }
   @media(max-width:600px){
      #homeimg { width: 35px; height: 28px; margin-left: 2%; }
            #pentoimg, #messageimg { width: 32px; height: 30px; margin-left: 10%; }
            #videoimg { width: 36px; height: 32px; margin-left: 8%; }
            #bellimg { width: 30px; height: 30px; margin-left: auto; margin-right:7%; }
            #userimg { width: 28px; height: 28px; margin-right: 2%; }
   }
</style>
</head>
<body>
  <div class="header1">
        <div class="headone">
            <span class="name">ADARSHA</span>
            <i class="fa-solid fa-list" onclick="window.location.href='list.html'" id="list"></i>
        </div>
        <div class="headtwo">
            <img src="home.png" id="homeimg" onclick="window.location.href='index.html'">
            <img src="pento.png" id="pentoimg" onclick="window.location.href='post.html'">
            <img src="message.png" id="messageimg" onclick="window.location.href='message.html'">
            <img src="VIDEO.png" id="videoimg" onclick="window.location.href='vedio.html'">
            <img src="bell.png" id="bellimg">
            <img src="user.png" id="userimg" onclick="window.location.href='user.html'">
        </div>
    </div>
<div id="chatList"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, collection, query, where, onSnapshot, doc, setDoc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyB9Ed_6mJEZ_fhITCrf-d9P6KlgpQBLD14",
  authDomain: "robiul-84377.firebaseapp.com",
  projectId: "robiul-84377",
  storageBucket: "robiul-84377.firebasestorage.app",
  messagingSenderId: "476907665212",
  appId: "1:476907665212:web:b4dc619f0290a2241b1039"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const messaging = getMessaging(app);

onAuthStateChanged(auth, user => {
  if (!user) { window.location.href = "login.html"; return; }
  console.log("🔑 My UID:", user.uid);
  console.log("📧 My Email:", user.email);
  
  requestNotificationPermission(user.uid);
  loadChats(user.uid);
});

async function requestNotificationPermission(uid) {
  try {
    const permission = await Notification.requestPermission();
    if (permission === 'granted') {
      console.log('Notification permission granted.');
      
      const currentToken = await getToken(messaging, { 
        vapidKey: "BGhwKO6KN6oSk7S8DqjF4xUzJudhektpCkqP8MlkpEP3WyyaXyZ5IAsVYR0wnhxaeD99E0A9bpxLN0gVjPHAE-I" 
      });

      if (currentToken) {
        console.log("FCM Token:", currentToken);
        const userRef = doc(db, "users", uid);
        await setDoc(userRef, { fcmToken: currentToken }, { merge: true });
      } else {
        console.warn('No registration token available.');
      }
    } else {
      console.log('Unable to get permission to notify.');
    }
  } catch (err) {
    console.error('An error occurred while retrieving token. ', err);
  }
}

onMessage(messaging, (payload) => {
  console.log('Message received in foreground: ', payload);
  alert(`${payload.notification.title}: ${payload.notification.body}`);
});

function loadChats(uid) {
  const q = query(
    collection(db, "chats"),
    where("members", "array-contains", uid)
  );

  onSnapshot(q, snap => {
    console.log("📬 Total chats found:", snap.size);

    const box = document.getElementById("chatList");
    box.innerHTML = "";

    if (snap.empty) {
      box.innerHTML = "<p style='padding:20px;text-align:center;color:#888'>No chats yet</p>";
      return;
    }

    const chats = [];
    snap.forEach(d => {
      chats.push({ id: d.id, ...d.data() });
    });

    chats.sort((a, b) => {
      const t1 = a.lastTime?.toDate ? a.lastTime.toDate().getTime() : 0;
      const t2 = b.lastTime?.toDate ? b.lastTime.toDate().getTime() : 0;
      return t2 - t1;
    });

    chats.forEach(c => {
      const otherUid = c.members.find(x => x !== uid);
      const other = c.membersInfo?.[otherUid] || { name: "User" };
      const time = c.lastTime?.toDate 
        ? c.lastTime.toDate().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
        : "";

      box.innerHTML += `
        <div class="chat-item" onclick="location.href='chat.html?chatId=${c.id}'">
          <img src="user.png">
          <div class="info">
            <h4>${other.name}</h4>
            <p>${c.lastMessage || c.productName || ''}</p>
          </div>
          <div class="time">${time}</div>
        </div>
      `;
    });
  }, (error) => {
    console.error("❌ onSnapshot error:", error);
    const box = document.getElementById("chatList");
    box.innerHTML = `<p style='padding:20px;text-align:center;color:#e74c3c'>
      Error: ${error.message}
    </p>`;
  });
}
</script>
</body>
</html>
