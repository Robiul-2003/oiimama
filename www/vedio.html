<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Reels</title>
    <style>
        /* html এবং body-র উচ্চতা ফিক্স করা জরুরি */
        html, body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: rgb(251, 249, 249); 
            height: 100vh;
            overflow: hidden;
        }

        /* header */
        header {
            background: white;
            position: fixed; 
            width: 100%; 
            top: 0; 
            z-index: 999; 
            height: 90px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .header1 { max-width: 1400px; margin: auto; }
        .headone { justify-content: space-between; align-items: center; display: flex; }
        .name { font-size: 23px; padding-top: 10px; color: #031f50; font-weight: bold; cursor: pointer; }
        .headtwo { display: flex; align-items: center; margin-top: 7px; }
        .fa-list { font-size: 25px; cursor: pointer; padding-top: 10px; }

        /* search */
        #search { height: 30px; width: 40%; margin-left: 5%; }
        #homeimg { width: 40px; height: 30px; margin-left: 3%; border-radius: 5%; cursor: pointer; }
        #pentoimg { width: 35px; height: 32px; margin-left: 7%; border-radius: 5%; cursor: pointer; }
        #messageimg { width: 35px; height: 32px; margin-left: 7%; border-radius: 5%; cursor: pointer; }
        #videoimg { width: 40px; height: 35px; margin-left: 7%; border-radius: 5%; cursor: pointer; }
        #bellimg { width: 33px; height: 33px; margin-left: 7%; border-radius: 5%; cursor: pointer; }
        #userimg { width: 30px; height: 30px; margin-left: auto; margin-right: 4%; border-radius: 5%; cursor: pointer; }

        /* Feed Container - স্ক্রোলিং এর মূল জায়গা */
        .feed-container {
            margin-top: 90px;
            height: calc(100vh - 90px);
            overflow-y: scroll;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .feed-container::-webkit-scrollbar { display: none; }

        /* Video Card */
        .single-video-card {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: calc(100vh - 90px);
            margin: 0 auto;
            background: #000;
            overflow: hidden;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            box-sizing: border-box;
        }

        /* VIDEO */
        .video-player {
            width: 100%;
            height: 100%;
            cursor: pointer;
            object-fit: contain;
            background: #000;
        }

        /* RIGHT SIDE LIKE COMMENT SHARE */
        .reels-actions {
            position: absolute;
            right: 12px;
            bottom: 35%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            z-index: 10;
        }
        .reels-actions i {
            font-size: 30px;
            color: white;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
            -webkit-text-stroke: 1px rgba(0,0,0,0.7);
        }
        .reels-actions button {
            background: transparent;
            border: none;
            color: white;
            padding: 0;
            cursor: pointer;
        }

        /* BOTTOM USER + CAPTION */
        .reels-info { position: absolute; left: 15px; right: 80px; bottom: 20px; color: white; z-index: 10; text-shadow: 0 2px 5px black; }
        .user-info { display: flex; align-items: center; gap: 8px; }
        .user-info i { font-size: 32px; }
        .user-name { font-size: 16px; font-weight: bold; }

        /* Comment Box */
        .commentbox {
            display: none;
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 60%;
            background: white;
            color: black;
            z-index: 100;
            border-radius: 15px 15px 0 0;
            box-sizing: border-box;
            padding: 20px;
            overflow-y: auto;
        }
        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .comment-header button {
            border: none;
            background: transparent;
            font-size: 22px;
            cursor: pointer;
        }
        #inputtext { width: 80%; bottom: 5%; height: 25px; border-radius: 5px 0px 0px 5px; border: 2px solid rgb(81, 79, 79); position: absolute; }
        #sent { height: 32px; background: #031f50; border: none; color: white; width: 12%; border-radius: 0px 5px 5px 0px; bottom: 5%; position: absolute; left: 80%; }

        .video-caption {
            margin: 4px 0 0 0;
            line-height: 1.4;
            overflow-wrap: anywhere;
            word-break: break-word;
            white-space: normal;
        }
        .video-caption.clamped {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-caption.expanded {
            display: block;
            overflow: visible;
        }
        .more-btn {
            display: inline-block;
            background: none;
            border: none;
            color: #3897f0;
            font-weight: bold;
            cursor: pointer;
            padding: 2px 0;
            font-size: 13px;
        }
        .fa-rotate-right {
            width: 40px;
            height: 40px;
            background: rgb(241, 235, 235);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            position: fixed;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
        }

        /* ============ PREMIUM AD CARD ============ */
        .premium-ad-card {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: calc(100vh - 90px);
            margin: 0 auto;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            box-sizing: border-box;
        }

        .ad-sponsored {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #ff4757;
            color: white;
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 4px;
            font-weight: bold;
            z-index: 5;
        }

        .ad-main-area {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 60px 10px 10px;
            gap: 5px;
            min-height: 0;
        }

        .ad-image-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .ad-image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        .ad-info {
            padding: 2px 15px;
            text-align: center;
        }

        .ad-info h3 {
            margin: 3px 0;
            color: #031f50;
            font-size: 17px;
        }

        .ad-info p {
            margin: 0;
            color: #164595;
            font-weight: bold;
            font-size: 18px;
        }

        .ad-thumbnails {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            overflow-x: auto;
            justify-content: center;
            scrollbar-width: none;
        }

        .ad-thumbnails::-webkit-scrollbar { display: none; }

        .ad-thumbnails img {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            flex-shrink: 0;
            transition: border-color 0.2s;
            background: #fff;
        }

        .ad-thumbnails img:hover { border-color: #031f50; }

        .ad-thumbnails img.active {
            border-color: #031f50;
            border-width: 3px;
        }

        .ad-order-btn {
            display: block;
            margin: 8px 15px 20px;
            padding: 14px;
            background: #031f50;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 18px;
            transition: opacity 0.2s;
        }

        .ad-order-btn:hover { opacity: 0.9; }

        /* মোবাইল রেসপন্সিভ */
        @media(max-width:600px) {
            header { height: 78px; }
            .feed-container {
                margin-top: 78px;
                height: calc(100vh - 78px);
            }
            .single-video-card, .premium-ad-card { 
                width: 100%; 
                height: calc(100vh - 78px);
                border-radius: 0px; 
            }
            .header1 { width: 100%; }
            .headone { display: flex; align-items: center; }
            .name { font-size: 22px; margin-left: 4%; margin-top: 2px; }
            .headtwo { display: flex; align-items: center; margin-top: 0; }
            #search { display: none; }
            .fa-list { font-size: 23px; margin-left: auto; margin-right: 4%; }
            #homeimg { width: 35px; height: 28px; margin-left: 2%; }
            #pentoimg, #messageimg { width: 32px; height: 30px; margin-left: 10%; }
            #videoimg { width: 36px; height: 32px; margin-left: 8%; }
            #bellimg { width: 30px; height: 30px; margin-left: auto; margin-right: 2%; }
            #userimg { width: 28px; height: 28px; margin-right: 2%; }

            .video-player { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
            .reels-actions { right: 12px; bottom: 35%; gap: 20px; }
            .user-info { display: flex; align-items: center; gap: 8px; }
            .reels-info { bottom: 58px; left: 12px; right: 70px; }

            .ad-thumbnails img { width: 50px; height: 50px; }
            .ad-info h3 { font-size: 16px; }
            .ad-info p { font-size: 16px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header1">
        <div class="headone">
            <span class="name">ADARSHA</span>
            <i class="fa-solid fa-list" onclick="window.location.href='list.html'" id="list"></i>
        </div>
        <div class="headtwo">
            <img src="home.png" id="homeimg" onclick="window.location.href='index.html'">
            <img src="pento.png" id="pentoimg" onclick="window.location.href='post.html'">
            <img src="message.png" id="messageimg" onclick="window.location.href='message.html'">
            <input id="search" placeholder="Search product...">
            <img src="VIDEO.png" id="videoimg" onclick="window.location.href='vedio.html'">
            <img src="bell.png" id="bellimg">
            <img src="user.png" id="userimg" onclick="window.location.href='user.html'">
        </div>
    </div>
</header>
<i id="refreshIcon" class="fa-solid fa-rotate-right" onclick="location.reload()"></i>

<!-- ভিডিও ও অ্যাড Feed কনটেইনার -->
<div class="feed-container">
    <div id="allVideoList">
        <p style="text-align:center; color:#666; margin-top:50px;">Loading content...</p>
    </div>
</div>

<!-- Firebase SDK & Script -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB9Ed_6mJEZ_fhITCrf-d9P6KlgpQBLD14",
        authDomain: "robiul-84377.firebaseapp.com",
        projectId: "robiul-84377",
        storageBucket: "robiul-84377.firebasestorage.app",
        messagingSenderId: "476907665212",
        appId: "1:476907665212:web:874ccf5a0f2825f71b1039"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g,
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }

    async function loadAllContent() {
        const videoContainer = document.getElementById("allVideoList");

        try {
            const videosQuery = query(collection(db, "videos"), orderBy("createdAt", "desc"));
            const videosSnapshot = await getDocs(videosQuery);

            if (videosSnapshot.empty) {
                videoContainer.innerHTML = `<p style="text-align:center; color:#666; margin-top:50px;">No videos available.</p>`;
                return;
            }

            const videos = videosSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

            let userAds = [];
            try {
                const adsQuery = query(collection(db, "user-ads"));
                const adsSnapshot = await getDocs(adsQuery);
                userAds = adsSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } catch (adError) {
                console.error("❌ Ads error:", adError);
            }

            let html = "";
            let adIndex = 0;

            videos.forEach((data, index) => {
                const safeUserName = escapeHTML(data.userName || "User");
                const safeCaption = escapeHTML(data.caption || "");
                const safeVideoUrl = data.videoUrl || "";

                html += `
                    <div class="single-video-card">
                        <video class="video-player" src="${safeVideoUrl}" controls playsinline preload="metadata"></video>
                        <div class="reels-actions">
                            <button class="like-btn" data-video-id="${data.id}">
                                <i class="fa-regular fa-thumbs-up"></i><br>
                                <div class="count" style="color:white; font-size:12px; margin-top:2px;">0</div>
                            </button>
                            <button onclick="commentopen(this)"><i class="fa-regular fa-comment"></i></button>
                            <button class="btn-share" onclick="shareContent('${safeUserName} shared a video', '${safeCaption}', '${safeVideoUrl}')"><i class="fa-solid fa-share"></i></button>
                        </div>
                        <div class="commentbox" style="display:none;">
                            <div class="comment-header">
                                <h4>Comments</h4>
                                <button onclick="commentclose(this)">❌</button>
                            </div>
                            <input type="text" id="inputtext" placeholder="Comment">
                            <button id="sent">Sent</button>
                        </div>
                        <div class="reels-info">
                            <div class="user-info">
                                <i class="fa-solid fa-circle-user"></i>
                                <span class="user-name">${safeUserName}</span>
                            </div>
                            ${safeCaption ? `
                                <div class="caption-container">
                                    <p class="video-caption clamped">${safeCaption}</p>
                                    <button class="more-btn" onclick="toggleCaption(this)">More</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;

                if ((index + 1) % 4 === 0 && userAds.length > 0) {
                    const currentAd = userAds[adIndex % userAds.length];

                    const safeProductName = escapeHTML(currentAd.productName || "Product");
                    const safeProductPrice = escapeHTML(currentAd.price || "0");
                    const safeProductLink = currentAd.productLink || "#";

                    let adImages = [];
                    if (Array.isArray(currentAd.images) && currentAd.images.length > 0) {
                        adImages = currentAd.images;
                    } else if (currentAd.imageUrl) {
                        adImages = [currentAd.imageUrl];
                    } else {
                        adImages = ["logo.png"];
                    }

                    const mainImage = adImages[0];

                    const thumbnailsHTML = adImages.map((img, i) =>
                        `<img src="${escapeHTML(img)}"
                            alt="Thumb ${i+1}"
                            class="${i === 0 ? 'active' : ''}"
                            onclick="changeAdImage(this, '${escapeHTML(img)}')">`
                    ).join('');

                    html += `
                        <div class="premium-ad-card">
                            <span class="ad-sponsored">Sponsored</span>
                            <div class="ad-main-area">
                                <div class="ad-image-wrapper">
                                    <img class="ad-main-img" src="${escapeHTML(mainImage)}" alt="${safeProductName}">
                                </div>
                            </div>
                            <div class="ad-thumbnails">${thumbnailsHTML}</div>
                            <a href="${safeProductLink}" class="ad-order-btn">Order Now</a>
                        </div>
                    `;
                    adIndex++;
                }
            });

            videoContainer.innerHTML = html;
            setupAutoPlayObserver();

        } catch (error) {
            console.error("Error fetching content:", error);
            videoContainer.innerHTML = `<p style="color:red; text-align:center; margin-top:50px;">Failed to load content: ${escapeHTML(error.message)}</p>`;
        }
    }

    window.changeAdImage = function(thumbElement, imgUrl) {
        const adCard = thumbElement.closest('.premium-ad-card');
        if (!adCard) return;

        const mainImg = adCard.querySelector('.ad-main-img');
        if (mainImg) mainImg.src = imgUrl;

        adCard.querySelectorAll('.ad-thumbnails img').forEach(img => {
            img.classList.remove('active');
        });
        thumbElement.classList.add('active');
    };

    window.toggleCaption = function(button) {
        const container = button.closest(".caption-container");
        const caption = container.querySelector(".video-caption");

        if (caption.classList.contains("expanded")) {
            caption.classList.remove("expanded");
            caption.classList.add("clamped");
            button.textContent = "More";
        } else {
            caption.classList.remove("clamped");
            caption.classList.add("expanded");
            button.textContent = "Less";
        }
    };

    window.shareContent = async function(title, text, url) {
        try {
            if (navigator.share) {
                await navigator.share({ title: title || 'Check this out!', text: text || '', url: url });
                return;
            }
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share) {
                await window.Capacitor.Plugins.Share.share({ title: title, text: text, url: url, dialogTitle: "Share Content" });
                return;
            }
            if (navigator.clipboard) {
                await navigator.clipboard.writeText(url);
                alert("Link copied to clipboard!");
                return;
            }
            alert("Sharing is not supported on this browser.");
        } catch (error) {
            if (error.name !== 'AbortError') console.error("Share Error:", error);
        }
    };

    function setupAutoPlayObserver() {
        const options = { root: null, rootMargin: "0px", threshold: 0.5 };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                const video = entry.target;
                if (entry.isIntersecting) {
                    video.muted = false;
                    video.volume = 1;
                    video.play().catch(error => console.log("Autoplay blocked:", error));
                } else {
                    video.pause();
                }
            });
        }, options);

        document.querySelectorAll(".video-player").forEach((video) => {
            observer.observe(video);
        });
    }

    window.commentopen = function(btn) {
        const card = btn.closest(".single-video-card");
        const box = card.querySelector(".commentbox");
        box.style.display = "block";
    };

    window.commentclose = function(devBtn) {
        const card = devBtn.closest(".single-video-card");
        const box = card.querySelector(".commentbox");
        box.style.display = "none";
    };

    window.addEventListener("DOMContentLoaded", loadAllContent);
</script>
</body>
</html>
