<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Video</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: rgb(251, 249, 249); }

        /* header */
        header {
            background: white;
            position: fixed; width: 100%; top: 0; z-index: 999; height: 90px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .header1 { max-width: 1400px; margin: auto; }
        .headone { justify-content: space-between; align-items: center; display: flex; }
        .name { font-size: 23px; padding-top: 10px; color: #031f50; font-weight: bold; cursor: pointer; }
        .headtwo { display: flex; align-items: center; margin-top: 7px; }
        .fa-list { font-size: 25px; cursor: pointer; padding-top: 10px; }

        /* search */
        #search { height: 30px; width: 40%; margin-left: 5%; }
        #homeimg { width: 40px; height: 30px; margin-left: 3%; color: blue; border-radius: 5%; cursor: pointer; }
        #pentoimg { width: 35px; height: 32px; margin-left: 7%; border-radius: 5%; cursor: pointer; }
        #messageimg { width: 35px; height: 32px; margin-left: 7%; border-radius: 5%; cursor: pointer; }
        #videoimg { width: 40px; height: 35px; margin-left: 7%; border-radius: 5%; cursor: pointer; }
        #bellimg { width: 33px; height: 33px; margin-left: 7%; border-radius: 5%; cursor: pointer; }
        #userimg { width: 30px; height: 30px; margin-left: auto; margin-right: 4%; border-radius: 5%; cursor: pointer; }

        .fa-magnifying-glass { display: none; }
        #ONEsearch { flex: 1; height: 35px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .feed-container {
    margin-top:85px;
     height: calc(100vh - 90px);
    height: calc(100dvh - 90px);

    overflow-y: auto;
    overflow-x: hidden;

    scroll-snap-type: y mandatory;

    scrollbar-width: none;
}
.feed-container::-webkit-scrollbar {
    display: none;
}
 .single-video-card { 
    position: relative;
     width: 100%;
      max-width: 500px;
    height: calc(100vh - 90px);
    height: calc(100dvh - 90px);
     margin: 0 auto;
     background: #000;
     overflow: hidden;
    
    scroll-snap-align: start;
    scroll-snap-stop: always;
    }
 /* VIDEO */
  .video-player {
     width: 100%;
      height:100%;
   
     object-fit:contain;
     background: #000; }
   /* RIGHT SIDE LIKE COMMENT SHARE */ 
 .reels-actions {
     position: absolute;
     right: 12px;
     bottom:35%;
     display: flex;
     flex-direction: column;
     align-items: center;
     gap: 18px;
    z-index: 10; } 
    /* ACTION BUTTON */
  .reels-btn {
     border: none; 
     cursor: pointer;
     display: flex;
     flex-direction: column;
     align-items: center;
     justify-content: center;
     gap: 5px;
     font-size: 12px;
     text-shadow: 0 2px 5px black; }
        /* ICON */
        .reels-actions i {
    font-size: 30px;
    color: white;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
    -webkit-text-stroke: 1px rgba(0,0,0,0.7);
}

.reels-actions button {
    background: transparent;
    border: none;
    color: white;
    padding: 0;
    cursor: pointer;
}
         .reels-btn i {   font-size: 30px;  filter: drop-shadow(0 2px 4px black); } 
         /* BUTTON HOVER */
         .reels-btn:hover { transform: scale(1.08);color:red; } 
         /* BOTTOM USER + CAPTION */
         .reels-info { position: absolute; left: 15px; right: 80px; bottom: 20px;  color: white; z-index: 10; text-shadow: 0 2px 5px black; }
          /* USER */
         .user-info { display: flex;  align-items: center; gap: 8px;  }
         .user-info i { font-size: 32px; }
         .user-name { font-size: 16px; font-weight: bold; } 
        /* মোবাইল রেসপন্সিভ */
        @media(max-width:600px) {
            header { height: 78px; }
            .header1 { width: 100%; }
            .headone { display: flex; align-items: center; }
            .name { font-size: 22px; margin-left: 4%; margin-top: 2px; }
            .headtwo { display: flex; align-items: center; margin-top: 0; }
            #search { display: none; }
            .fa-list { font-size: 23px; margin-left: auto; margin-right: 4%; }
            #homeimg { width: 35px; height: 28px; margin-left: 2%; }
            #pentoimg, #messageimg { width: 32px; height: 30px; margin-left: 10%; }
            #videoimg { width: 36px; height: 32px; margin-left: 8%; }
            #bellimg { width: 30px; height: 30px; margin-left: auto; margin-right: 2%; }
            #userimg { width: 28px; height: 28px; margin-right: 2%; }
          
          .single-video-card { width:100%;     border-radius:5px; }
          .video-player {  width: 100%;   height:100%; display: block;  object-fit:contain; background: #000; }
          .reels-actions { right:12px; bottom:35%; gap: 20px; }
           .user-info { display: flex;  align-items: center; gap: 8px;  }
          .reels-btn i { font-size: 29px; } .reels-info { bottom: 58px; left: 12px; right: 70px; } }
    </style>
</head>
<body>

<header>
    <div class="header1">
        <div class="headone">
            <span class="name" onclick="window.location.href='test1.html'">ADARSHA </span>
            <i class="fa-solid fa-magnifying-glass" onclick="searchicon()"></i>
            <i class="fa-solid fa-list" onclick="window.location.href='list.html'" id="list"></i>
        </div>
        <div class="headtwo">
            <img src="home.png" id="homeimg" onclick="window.location.href='home.html'">
            <img src="pento.png" id="pentoimg" onclick="window.location.href='post.html'">
            <img src="message.png" id="messageimg" onclick="window.location.href='message.html'">
            <input id="search" placeholder="Search product ... ." onkeyup="searchProduct()">
            <img src="VIDEO.png" id="videoimg" onclick="window.location.href='vedio.html'">
            <img src="bell.png" id="bellimg">
            <img src="user.png" id="userimg" onclick="window.location.href='user.html'">
        </div>
    </div>
</header>

<!-- ভিডিও Feed কনটেইনার -->
<div class="feed-container">
    <div id="allVideoList">
        <p style="text-align:center; color:#666;">Loading videos...</p>
    </div>
</div>

<!-- Firebase SDK & Script -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB9Ed_6mJEZ_fhITCrf-d9P6KlgpQBLD14",
        authDomain: "robiul-84377.firebaseapp.com",
        projectId: "robiul-84377",
        storageBucket: "robiul-84377.firebasestorage.app",
        messagingSenderId: "476907665212",
        appId: "1:476907665212:web:874ccf5a0f2825f71b1039"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function escapeHTML(str) {
        if (!str) return '';
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    async function loadAllVideos() {
        const videoContainer = document.getElementById("allVideoList");

        try {
            const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
            const querySnapshot = await getDocs(q);

            videoContainer.innerHTML = "";

            if (querySnapshot.empty) {
                videoContainer.innerHTML = `<p style="text-align:center;">No videos available.</p>`;
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();

                const safeUserName = escapeHTML(data.userName || "User");
                const safeCaption = escapeHTML(data.caption || "");
                const safeVideoUrl = escapeHTML(data.videoUrl);

                videoContainer.innerHTML += `
                      <div class="single-video-card">
                        <video class="video-player" src="${safeVideoUrl}" controls  playsinline preload="metadata">  </video>
                           
                         <div class="reels-actions">
                            <button class="like-btn" data-video-id="${docSnap.id}">
    <i class="fa-regular fa-thumbs-up"></i>
    <br>
    <div class="count">0</div>
</button>
                            <button id="comment"><i class="fa-regular fa-comment"></i></button>
                            <button class="btn-share" onclick="shareContent('${safeUserName} shared a video', '${safeCaption}', '${safeVideoUrl}')">
                               <i class="fa-solid fa-share"></i> </button>
                               </div>
                       <!-- USER + CAPTION -->
                        <div class="reels-info">
                        <div class="user-info">
                            <i class="fa-solid fa-circle-user"></i>
                            <span class="user-name">${safeUserName}</span>
                        </div>
                        ${safeCaption ? `<p class="video-caption">${safeCaption}</p>` : ''}
                </div>
                    </div>
                          
                       
                `; // 🟢 সংশোধন: </div> ট্যাগ সঠিকভাবে বন্ধ করা হয়েছে
            });

            // ভিডিও DOM-এ রেন্ডার শেষ হলে অটো-প্লে অবজার্ভার চালুকরণ
            setupAutoPlayObserver();

        } catch (error) {
            console.error("Error fetching videos:", error);
            videoContainer.innerHTML = `<p style="color:red; text-align:center;">Failed to load videos.</p>`;
        }
    }

    /* ================ share button ====================== */
    window.shareContent = async function(title, text, url) {
        try {
            if (navigator.share) {
                await navigator.share({
                    title: title || 'Check this out!',
                    text: text || '',
                    url: url
                });
                return;
            }

            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share) {
                await window.Capacitor.Plugins.Share.share({
                    title: title,
                    text: text,
                    url: url,
                    dialogTitle: "Share Content"
                });
                return;
            }

            if (navigator.clipboard) {
                await navigator.clipboard.writeText(url);
                alert("Link copied to clipboard!");
                return;
            }

            alert("Sharing is not supported on this browser.");

        } catch (error) {
            if (error.name !== 'AbortError') {
                console.error("Share Error:", error);
            }
        }
    };

    /* ============INTERSECTION OBSERVER FOR SCROLL AUTOPLAY====== */
    function setupAutoPlayObserver() {
        const options = {
            root: null,
            rootMargin: "0px",
            threshold: 0.5 // ৫০% ভিডিও ভিউপোর্টে আসলে চালু হবে
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                const video = entry.target;
            if (entry.isIntersecting) {
    // 🔊 Speaker ON
    video.muted = false;
    video.volume = 1;

    video.play().catch(error => {
        console.log("Autoplay with sound blocked:", error);
    });

} else {
    video.pause();
}
               
            });
        }, options);

        document.querySelectorAll(".video-player").forEach((video) => {
            observer.observe(video);
        });
    }
    // পেজ লোড হলে ভিডিও ডাটা ফেচ হবে
    window.addEventListener("DOMContentLoaded", loadAllVideos);
</script>
</body>
</html>
