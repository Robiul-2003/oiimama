<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="[https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css](https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css)">
    <title>Document</title>
<style>
  #imgicon{
   width:30px;height:30px; border:px solid red;
  }
</style>
<body>
   
    <input type="file" id="imgeInput" accept="imgae/*">
    <i class="fa-regular fa-bell"></i>
    <img id="preview" width="300">
<i class="bi bi-house" style="font-size: 24px;"></i><img src="house-regular-full.svg" id="imgicon">
   <script>
    const input = document.getElementById('imgeInput');
    const preview = document.getElementById('preview');
    input.addEventListener("change", function(){
      const file = this.files[0];

      if(file){
        preview.src =URL.createObjectURL(file);
      }
    });
    </script>
</body>
</html>
