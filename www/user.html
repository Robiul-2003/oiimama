<style>

*{

}

body{

/* ================= HEADER ================= */

header{
    background:white;
    position:fixed;

.header1{

}

.headone{

}

}

.fa-list{

}

#search{

}

#homeimg{

}

#pentoimg{
    width:35px;

    margin-left:7%;
    border-radius:5%;
    cursor:pointer;
}

#messageimg{

/* ================= SEARCH MOBILE ================= */

#opensearchbox{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;
    background:#031f50;
    display:none;
    z-index:9999;
}

.search-inner{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
}

#ONEsearch{
    height:35px;
    width:80%;
    margin-left:5%;

    border-radius:5px;
    padding:5px 10px;
}

#X{
    color:red;
    font-size:30px;
    cursor:pointer;
    margin:0;
}

/* ================= SIDE LIST ================= */

#openlistbox{
    position:fixed;
    top:0;
    left:80%;
    width:20%;
    height:100%;
    background:white;
    display:none;
    z-index:9999;
    box-shadow:-2px 0 5px rgba(0,0,0,.2);
}

#openlistbox h2{

}

.fa-angle-left{
    font-size:30px;

}

/* ================= PROFILE ================= */

.userfile{
    max-width:650px;
    border:1px solid rgb(234,230,230);
    margin:90px auto 30px;
    background:white;
    padding-bottom:20px;
    min-height:500px;
}

#profilebox{
    width:300px;
    height:300px;
    border:2px solid #031f50;
    border-radius:50%;
    margin:20px auto;
    overflow:hidden;
    background:#eee;
}

#profilebox label{
    width:100%;
    height:100%;
    display:block;
    cursor:pointer;
}

#preview{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

#profileimg{
    display:none;
}

#showName{
    text-align:center;
    color:#031f50;
    margin:10px 0;
}

/* ================= BUTTONS ================= */

.profile-buttons{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin:15px auto;
}

#likebtn,
#chatbtn{
     height:35px;
    background:#072455;
    border:none;
    color:white;
    border-radius:5px;
    font-size:16px;
    padding:0 20px;
    cursor:pointer;
}


#likebtn:hover,
#chatbtn:hover{
 opacity:.9;
}
/* ================= FEEDS ================= */

.feed-title{
    text-align:center;
    color:#031f50;
    margin-top:25px;
}

#productList{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    padding:10px;
}

#userVideoFeed,
#userPostFeed{
    width:100%;
}

/* ================= POST ================= */

.post-card{
    background:#fff;
    border:1px solid #ddd;
    padding:15px;
    margin:10px;
    border-radius:8px;
}

.post-user{
    color:#031f50;
}

.delete-btn{
    background:red;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
}

.delete-btn:hover{
    opacity:.85;
}

/* ================= VIDEO ================= */

.video-card{
    border:1px solid #ddd;
    padding:15px;
    margin:15px 10px;
    border-radius:8px;
    background:#fff;
}

.video-frame{
    width:100%;
    max-width:500px;
    margin:auto;
    display:block;
}

.video-actions{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
    flex-wrap:wrap;
}

.view-bar{
    width:150px;
    height:20px;
    border:1px solid #8a8888;
    display:inline-block;
    border-radius:5px;
    vertical-align:middle;
    overflow:hidden;
}

.view-fill{
    height:100%;
    width:0%;
    transition:width .5s ease-in-out;
    background:#031f50;
}

.success-btn{
    display:none;
    background:green;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
}

/* ================= PRODUCT ================= */

.product-card{
    width:170px;
    flex:0 0 170px;
    border:1px solid #ddd;
    border-radius:6px;
    background:#fff;
    padding:8px;
    cursor:pointer;
}

.product-card img{
    width:100%;
    height:150px;
    object-fit:cover;
    border-radius:4px;
}

.product-name{
    min-height:40px;
    margin:8px 0;
}

.product-price{
    color:green;

}

/* ================= MOBILE ================= */

@media(max-width:700px){

    }

    #openlistbox{

    }

    .userfile{
        width:100%;
        margin-top:78px;

    }

    #profilebox{
        width:200px;

    }

    #homeimg{

        height:28px;
        margin-left:2%;
    }

    #pentoimg,
    #messageimg{
        width:32px;
        height:30px;
        margin-left:10%;
    }

    #videoimg{

        margin-left:8%;
    }

    #bellimg{

        height:30px;
        margin-left:auto;
        margin-right:2%;
    }

    #userimg{
        width:28px;
        height:28px;
        margin-right:2%;
    }

    .product-card{
        width:160px;
        flex-basis:160px;
    }

    }

}

</style>

<script type="module">

/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    onSnapshot,
    query,
    where,
    doc,
    getDoc,
    deleteDoc,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey: "AIzaSyB9Ed_6mJEZ_fhITCrf-d9P6KlgpQBLD14",

    authDomain: "robiul-84377.firebaseapp.com",

    projectId: "robiul-84377",

    storageBucket: "robiul-84377.firebasestorage.app",

    messagingSenderId: "476907665212",

    appId: "1:476907665212:web:874ccf5a0f2825f71b1039"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =====================================================
   HELPER
===================================================== */

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =====================================================
   PROFILE IMAGE PREVIEW
===================================================== */

const profileInput =
    document.getElementById("profileimg");

const profilePreview =
    document.getElementById("preview");


profileInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    profilePreview.src =
        URL.createObjectURL(file);

});


/* =====================================================
   DELETE POST
   OWNERSHIP CHECK
===================================================== */

window.deletePost = async function(postId){

    if(!confirm("Delete this post?")){
        return;
    }

    try{

        const user = auth.currentUser;

        if(!user){

            alert("Please login first.");

            return;
        }


        const postRef =
            doc(db,"jobs",postId);

        const postSnap =
            await getDoc(postRef);


        if(!postSnap.exists()){

            alert("Post not found.");

            return;
        }


        const postData =
            postSnap.data();


        /* IMPORTANT:
           Check ownership
        */

        if(postData.userId !== user.uid){

            alert(
                "You cannot delete another user's post."
            );

            return;
        }


        await deleteDoc(postRef);

        alert(
            "Post Deleted Successfully"
        );


    }catch(error){

        console.error(
            "Delete Post Error:",
            error
        );

        alert(
            "Delete Failed: " +
            error.message
        );

    }

};


/* =====================================================
   DELETE VIDEO
   OWNERSHIP CHECK
===================================================== */

window.deleteVideo = async function(videoId){

    if(!confirm("Do you want to delete this video?")){

        return;
    }


    try{

        const user = auth.currentUser;


        if(!user){

            alert("Please login first.");

            return;
        }


        const videoRef =
            doc(db,"videos",videoId);


        const videoSnap =
            await getDoc(videoRef);


        if(!videoSnap.exists()){

            alert("Video not found.");

            return;
        }


        const videoData =
            videoSnap.data();


        /* IMPORTANT:
           Check ownership
        */

        if(videoData.userId !== user.uid){

            alert(
                "You cannot delete another user's video."
            );

            return;
        }


        await deleteDoc(videoRef);


        alert(
            "Video Deleted Successfully"
        );


    }catch(error){

        console.error(
            "Delete Video Error:",
            error
        );

        alert(
            "Delete Failed: " +
            error.message
        );

    }

};


/* =====================================================
   DELETE PRODUCT
   OWNERSHIP CHECK
===================================================== */

window.deleteProduct = async function(productId){

    if(!confirm("এই Product Delete করতে চান?")){

        return;
    }


    try{

        const user = auth.currentUser;


        if(!user){

            alert("আগে Login করুন।");

            return;
        }


        const productRef =
            doc(db,"products",productId);


        const productSnap =
            await getDoc(productRef);


        if(!productSnap.exists()){

            alert("Product পাওয়া যায়নি।");

            return;
        }


        const productData =
            productSnap.data();


        /* IMPORTANT:
           Check ownership
        */

        if(productData.userId !== user.uid){

            alert(
                "এই Product আপনি Delete করতে পারবেন না।"
            );

            return;
        }


        await deleteDoc(productRef);


        alert(
            "Product Deleted Successfully"
        );


    }catch(error){

        console.error(
            "Delete Product Error:",
            error
        );

        alert(
            "Delete Failed: " +
            error.message
        );

    }

};


/* =====================================================
   LOAD USER PRODUCTS
   ONLY CURRENT USER
===================================================== */

async function loadProducts(userId){

    const productList =
        document.getElementById("productList");


    try{

        /* IMPORTANT:
           এখানে আর সব products নেওয়া হচ্ছে না।
           শুধু current user's products নেওয়া হচ্ছে।
        */

        const productQuery = query(
            collection(db,"products"),
            where("userId","==",userId)
        );


        const querySnapshot =
            await getDocs(productQuery);


        productList.innerHTML = "";


        if(querySnapshot.empty){

            productList.innerHTML = `
                <p style="text-align:center;width:100%;">
                    No Products
                </p>
            `;

            return;
        }


        querySnapshot.forEach((docSnap)=>{

            const p =
                docSnap.data();


            const productId =
                docSnap.id;


            let img =
                "logo.png";


            if(
                Array.isArray(p.images) &&
                p.images.length > 0
            ){

                img =
                    p.images[0];

            }


            let price =
                p.price;


            if(Array.isArray(price)){

                price =
                    price[0] || "0";

            }


            if(
                price === undefined ||
                price === null ||
                price === ""
            ){

                price = "0";

            }


            const safeName =
                escapeHTML(
                    p.name || "No Name"
                );


            const safePrice =
                escapeHTML(price);


            productList.innerHTML += `

                <div class="product-card">

                    <img
                        src="${escapeHTML(img)}"
                        alt="${safeName}"
                        onerror="this.src='logo.png'"
                    >

                    <p class="product-name">
                        ${safeName}
                    </p>

                    <div class="product-price">
                        ${safePrice} TK
                    </div>

                    <br>

                    <button
                        class="delete-btn"
                        onclick="
                            window.deleteProduct('${productId}')
                        "
                    >
                        Delete
                    </button>

                </div>

            `;

        });


    }catch(error){

        console.error(
            "Load Products Error:",
            error
        );


        productList.innerHTML = `

            <p style="
                color:red;
                text-align:center;
                width:100%;
            ">
                Products load failed.
            </p>

        `;

    }

}


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    async (user)=>{

        if(!user){

            /* =====================
               NOT LOGGED IN
            ===================== */

            document.getElementById(
                "showName"
            ).textContent =
                "Guest User";


            document.getElementById(
                "productList"
            ).innerHTML = `

                <p style="
                    text-align:center;
                    width:100%;
                ">
                    Please login to see your products.
                </p>

            `;


            document.getElementById(
                "userPostFeed"
            ).innerHTML = `

                <p style="text-align:center;">
                    Please login to see your posts.
                </p>

            `;


            document.getElementById(
                "userVideoFeed"
            ).innerHTML = `

                <p style="text-align:center;">
                    Please login to see your videos.
                </p>

            `;


            return;
        }


        /* =================================================
           CURRENT USER UID
        ================================================= */

        const currentUid =
            user.uid;


        console.log(
            "Logged in UID:",
            currentUid
        );


        /* =================================================
           LOAD USER PROFILE
        ================================================= */

        try{

            const userRef =
                doc(
                    db,
                    "users",
                    currentUid
                );


            const userSnap =
                await getDoc(userRef);


            if(userSnap.exists()){

                const data =
                    userSnap.data();


                document.getElementById(
                    "showName"
                ).textContent =
                    data.name || "No Name Set";


                /* Optional profile image */

                if(data.photoURL){

                    profilePreview.src =
                        data.photoURL;

                }

            }else{

                document.getElementById(
                    "showName"
                ).textContent =
                    user.displayName ||
                    "No Name Set";

            }


        }catch(error){

            console.error(
                "User Profile Error:",
                error
            );

            document.getElementById(
                "showName"
            ).textContent =
                user.displayName ||
                "User";

        }


        /* =================================================
           LOAD ONLY CURRENT USER PRODUCTS
        ================================================= */

        await loadProducts(
            currentUid
        );


        /* =================================================
           USER POSTS
        ================================================= */

        const postFeed =
            document.getElementById(
                "userPostFeed"
            );


        try{

            /* এখানে orderBy বাদ দেওয়া হয়েছে।
               তাই Firebase composite index
               না থাকলেও এই query কাজ করবে।
            */

            const postQuery = query(
                collection(db,"jobs"),
                where(
                    "userId",
                    "==",
                    currentUid
                )
            );


            onSnapshot(
                postQuery,
                (snapshot)=>{

                    postFeed.innerHTML = "";


                    if(snapshot.empty){

                        postFeed.innerHTML = `
                            <p style="text-align:center;">
                                No Posts
                            </p>
                        `;

                        return;
                    }


                    let posts = [];


                    snapshot.forEach(
                        (docSnap)=>{

                            posts.push({

                                id:docSnap.id,

                                data:docSnap.data()

                            });

                        }
                    );


                    /* Client-side sorting */

                    posts.sort(
                        (a,b)=>{

                            const aTime =
                                a.data.createdAt?.toMillis?.() || 0;

                            const bTime =
                                b.data.createdAt?.toMillis?.() || 0;

                            return bTime-aTime;

                        }
                    );


                    posts.forEach(
                        ({id,data})=>{

                            const userName =
                                escapeHTML(
                                    data.userName ||
                                    "User"
                                );


                            const postText =
                                escapeHTML(
                                    data.post ||
                                    ""
                                );


                            postFeed.innerHTML += `

                                <div class="post-card">

                                    <h3 class="post-user">
                                        ${userName}
                                    </h3>

                                    <p>
                                        ${postText}
                                    </p>

                                    <button
                                        class="delete-btn"
                                        onclick="
                                            window.deletePost('${id}')
                                        "
                                    >
                                        Delete
                                    </button>

                                </div>

                            `;

                        }
                    );

                },

                (error)=>{

                    console.error(
                        "Post Snapshot Error:",
                        error
                    );


                    postFeed.innerHTML = `

                        <p style="
                            color:red;
                            text-align:center;
                        ">
                            Posts load failed.
                        </p>

                    `;

                }
            );


        }catch(error){

            console.error(
                "Post Query Error:",
                error
            );

        }


        /* =================================================
           USER VIDEOS
        ================================================= */

        const videoFeed =
            document.getElementById(
                "userVideoFeed"
            );


        try{

            const videoQuery = query(
                collection(db,"videos"),
                where(
                    "userId",
                    "==",
                    currentUid
                )
            );


            onSnapshot(
                videoQuery,
                (querySnapshot)=>{

                    let userVideos = [];


                    querySnapshot.forEach(
                        (docSnap)=>{

                            userVideos.push({

                                id:docSnap.id,

                                ...docSnap.data()

                            });

                        }
                    );


                    /* =====================
                       SORT VIDEOS
                    ===================== */

                    userVideos.sort(
                        (a,b)=>{

                            const timeA =
                                a.createdAt?.toMillis?.() || 0;

                            const timeB =
                                b.createdAt?.toMillis?.() || 0;

                            return timeB-timeA;

                        }
                    );


                    videoFeed.innerHTML = "";


                    if(userVideos.length === 0){

                        videoFeed.innerHTML = `

                            <p style="
                                text-align:center;
                                color:gray;
                            ">
                                আপনি এখনো কোনো ভিডিও যোগ করেননি।
                            </p>

                        `;

                        return;
                    }


                    /* =====================
                       RENDER VIDEOS
                    ===================== */

                    userVideos.forEach(
                        (data)=>{

                            const videoCard =
                                document.createElement(
                                    "div"
                                );


                            videoCard.className =
                                "video-card";


                            const safeUserName =
                                escapeHTML(
                                    data.userName ||
                                    "User"
                                );


                            const safeCaption =
                                escapeHTML(
                                    data.caption ||
                                    "No Caption"
                                );


                            const link =
                                data.link || "";


                            let videoElement = "";


                            /* =====================
                               YOUTUBE
                            ===================== */

                            if(
                                link.includes(
                                    "youtube.com"
                                ) ||
                                link.includes(
                                    "youtu.be"
                                )
                            ){

                                let embedLink =
                                    link
                                    .replace(
                                        "watch?v=",
                                        "embed/"
                                    )
                                    .replace(
                                        "youtu.be/",
                                        "youtube.com/embed/"
                                    );


                                if(
                                    embedLink.includes(
                                        "shorts/"
                                    )
                                ){

                                    embedLink =
                                        embedLink.replace(
                                            "shorts/",
                                            "embed/"
                                        );

                                }


                                videoElement = `

                                    <iframe
                                        class="video-frame"
                                        height="300"
                                        src="${escapeHTML(embedLink)}"
                                        frameborder="0"
                                        allowfullscreen>
                                    </iframe>

                                `;

                            }


                            /* =====================
                               FACEBOOK
                            ===================== */

                            else if(
                                link.includes(
                                    "facebook.com"
                                ) ||
                                link.includes(
                                    "fb.watch"
                                )
                            ){

                                const fbEmbedLink =
                                    "https://www.facebook.com/plugins/video.php?href="
                                    +
                                    encodeURIComponent(link)
                                    +
                                    "&show_text=false&width=500";


                                videoElement = `

                                    <iframe
                                        class="video-frame"
                                        height="300"
                                        src="${fbEmbedLink}"
                                        frameborder="0"
                                        scrolling="no"
                                        allowfullscreen>
                                    </iframe>

                                `;

                            }


                            /* =====================
                               TIKTOK
                            ===================== */

                            else if(
                                link.includes(
                                    "tiktok.com"
                                )
                            ){

                                const parts =
                                    link.split(
                                        "/video/"
                                    );


                                if(
                                    parts.length > 1
                                ){

                                    const videoId =
                                        parts[1]
                                        .split("?")[0]
                                        .split("/")[0];


                                    if(videoId){

                                        const tiktokEmbed =
                                            "https://www.tiktok.com/embed/v2/"
                                            +
                                            encodeURIComponent(
                                                videoId
                                            );


                                        videoElement = `

                                            <iframe
                                                class="video-frame"
                                                height="500"
                                                src="${tiktokEmbed}"
                                                frameborder="0"
                                                allowfullscreen>
                                            </iframe>

                                        `;

                                    }

                                }

                            }


                            /* =====================
                               DIRECT VIDEO
                            ===================== */

                            else if(link){

                                videoElement = `

                                    <video
                                        class="video-frame"
                                        controls
                                        playsinline
                                        style="
                                            max-height:500px;
                                            border-radius:4px;
                                        "
                                    >

                                        <source
                                            src="${escapeHTML(link)}"
                                            type="video/mp4"
                                        >

                                        Your browser does not
                                        support video.

                                    </video>

                                `;

                            }


                            /* =====================
                               FORM URL
                            ===================== */

                            const formUrl =
                                "https://docs.google.com/forms/d/e/1FAIpQLSeiv4UtgfMMipGHC3touEnpk1_L-9GuB9kzIJWqOdROfCNJmw/viewform?usp=pp_url&entry.1795539139="
                                +
                                encodeURIComponent(link);


                            const likes =
                                Number(
                                    data.likes || 0
                                );


                            const views =
                                Number(
                                    data.views || 0
                                );


                            const viewPercent =
                                Math.min(
                                    (views / 1000) * 100,
                                    100
                                );


                            videoCard.innerHTML = `

                                <h3 class="post-user">
                                    ${safeUserName}
                                </h3>

                                ${videoElement}

                                <p style="
                                    padding-top:10px;
                                    margin:0;
                                    font-weight:bold;
                                ">
                                    ${safeCaption}
                                </p>

                                <p style="
                                    font-size:12px;
                                    color:#777;
                                ">
                                    ${likes} Likes |
                                    ${views} Views
                                </p>


                                <div class="video-actions">

                                    <button
                                        class="delete-btn"
                                        onclick="
                                            window.deleteVideo('${data.id}')
                                        "
                                    >
                                        Delete
                                    </button>


                                    <button
                                        id="success-${data.id}"
                                        class="success-btn"
                                        onclick="
                                            window.open(
                                                '${formUrl}',
                                                '_blank'
                                            )
                                        "
                                    >
                                        Success
                                    </button>


                                    <div class="view-bar">

                                        <div
                                            class="view-fill"
                                            id="bar-${data.id}"
                                        ></div>

                                    </div>

                                </div>

                            `;


                            videoFeed.appendChild(
                                videoCard
                            );


                            /* Progress bar */

                            setTimeout(
                                ()=>{

                                    const bar =
                                        document.getElementById(
                                            `bar-${data.id}`
                                        );


                                    if(bar){

                                        bar.style.width =
                                            viewPercent + "%";

                                    }

                                },
                                100
                            );


                            /* 1000 views */

                            if(views >= 1000){

                                setTimeout(
                                    ()=>{

                                        const btn =
                                            document.getElementById(
                                                `success-${data.id}`
                                            );


                                        if(btn){

                                            btn.style.display =
                                                "block";

                                        }

                                    },
                                    100
                                );

                            }

                        }
                    );

                },

                (error)=>{

                    console.error(
                        "Video Snapshot Error:",
                        error
                    );


                    videoFeed.innerHTML = `

                        <p style="
                            color:red;
                            text-align:center;
                        ">
                            Videos load failed.
                        </p>

                    `;

                }
            );


        }catch(error){

            console.error(
                "Video Query Error:",
                error
            );

        }

    }
);


/* =====================================================
   MOBILE SEARCH
===================================================== */

window.searchicon = function(){

    const box =
        document.getElementById(
            "opensearchbox"
        );

    if(box){

        box.style.display =
            "block";

    }

};


window.searchclose = function(){

    const box =
        document.getElementById(
            "opensearchbox"
        );

    if(box){

        box.style.display =
            "none";

    }

};


/* =====================================================
   SEARCH PRODUCT
===================================================== */

window.searchProduct = function(){

    const desktopSearch =
        document.getElementById(
            "search"
        );


    const mobileSearch =
        document.getElementById(
            "ONEsearch"
        );


    const searchText =
        (
            desktopSearch?.value ||
            mobileSearch?.value ||
            ""
        )
        .toLowerCase()
        .trim();


    const cards =
        document.querySelectorAll(
            ".product-card"
        );


    cards.forEach(
        card=>{

            const text =
                card.textContent
                .toLowerCase();


            if(
                text.includes(searchText)
            ){

                card.style.display =
                    "block";

            }else{

                card.style.display =
                    "none";

            }

        }
    );

};
</script>
</body>
</html>
