<script type="module">

/* =====================================================
   FIREBASE IMPORT
===================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import { 
    getFirestore, 
    collection, 
    query, 
    where, 
    doc, 
    getDoc, 
    deleteDoc, 
    getDocs,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {
    apiKey: "AIzaSyB9Ed_6mJEZ_fhITCrf-d9P6KlgpQBLD14",
    authDomain: "robiul-84377.firebaseapp.com",
    projectId: "robiul-84377",
    storageBucket: "robiul-84377.firebasestorage.app",
    messagingSenderId: "476907665212",
    appId: "1:476907665212:web:874ccf5a0f2825f71b1039"
};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* =====================================================
   HELPER
===================================================== */

function escapeHTML(value){
    if(value === null || value === undefined){
        return "";
    }
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =====================================================
   PROFILE IMAGE PREVIEW
===================================================== */

const profileInput = document.getElementById("profileimg");
const profilePreview = document.getElementById("preview");

profileInput.addEventListener("change", function(){
    const file = this.files[0];
    if(!file) return;
    profilePreview.src = URL.createObjectURL(file);
});


/* =====================================================
   DELETE PRODUCT
===================================================== */

window.deleteProduct = async function(productId){
    if(!confirm("এই Product Delete করতে চান?")) return;

    try{
        const user = auth.currentUser;
        if(!user){
            alert("আগে Login করুন।");
            return;
        }

        const productRef = doc(db,"products",productId);
        const productSnap = await getDoc(productRef);

        if(!productSnap.exists()){
            alert("Product পাওয়া যায়নি।");
            return;
        }

        const productData = productSnap.data();

        if(productData.userId !== user.uid){
            alert("এই Product আপনি Delete করতে পারবেন না।");
            return;
        }

        await deleteDoc(productRef);
        alert("Product Deleted Successfully");

    }catch(error){
        console.error("Delete Product Error:", error);
        alert("Delete Failed: " + error.message);
    }
};


/* =====================================================
   LOAD SPECIFIC USER PRODUCTS (শুধুমাত্র নিজ আইডি-র প্রোডাক্ট)
===================================================== */

async function loadProducts(userId){
    const productList = document.getElementById("productList");

    try{
        const productQuery = query(
            collection(db,"products"),
            where("userId","==",userId)
        );

        const querySnapshot = await getDocs(productQuery);
        productList.innerHTML = "";

        if(querySnapshot.empty){
            productList.innerHTML = `
                <p style="text-align:center;width:100%;">No Products Found</p>
            `;
            return;
        }

        querySnapshot.forEach((docSnap)=>{
            const p = docSnap.data();
            const productId = docSnap.id;

            let img = "logo.png";
            if(Array.isArray(p.images) && p.images.length > 0){
                img = p.images[0];
            }

            let price = p.price;
            if(Array.isArray(price)){
                price = price[0] || "0";
            }
            if(price === undefined || price === null || price === ""){
                price = "0";
            }

            const safeName = escapeHTML(p.name || "No Name");
            const safePrice = escapeHTML(price);

            productList.innerHTML += `
                <div class="product-card">
                    <img src="${escapeHTML(img)}" alt="${safeName}" onerror="this.src='logo.png'">
                    <p class="product-name">${safeName}</p>
                    <div class="product-price">${safePrice} TK</div>
                    <br>
                    <button class="delete-btn" onclick="window.deleteProduct('${productId}')">Delete</button>
                </div>
            `;
        });

    }catch(error){
        console.error("Load Products Error:", error);
        productList.innerHTML = `
            <p style="color:red;text-align:center;width:100%;">Products load failed.</p>
        `;
    }
}

/* =====================================================
   AUTH STATE (ইউজার চেক ও ডেটা লোড)
===================================================== */

onAuthStateChanged(auth, async (user)=>{

    if(!user){
        document.getElementById("showName").textContent = "Guest User";
        document.getElementById("productList").innerHTML = `
            <p style="text-align:center;width:100%;">Please login to see your profile.</p>
        `;
       /* document.getElementById("videobox").style.display = "none";*/
        return;
    }

    const currentUid = user.uid;

    /* Load Profile */
    try{
        const userRef = doc(db, "users", currentUid);
        const userSnap = await getDoc(userRef);

        if(userSnap.exists()){
            const data = userSnap.data();
            document.getElementById("showName").textContent = data.name || "No Name Set";
            if(data.photoURL){
                profilePreview.src = data.photoURL;
            }
        }else{
            document.getElementById("showName").textContent = user.displayName || "No Name Set";
        }
    }catch(error){
        console.error("User Profile Error:", error);
        document.getElementById("showName").textContent = user.displayName || "User";
    }

    /* Ashik বা বর্তমানে লগইন থাকা ইউজারের প্রোডাক্ট লোড */
    await loadProducts(currentUid);

});

/* =====================================================
   FIRESTORE POST SYSTEM
===================================================== */
// ================= LOAD POSTS =================

async function displayPosts() {

    const postList = document.getElementById("postList");

    if (!postList) return;

    try {

        const user = auth.currentUser;

        if (!user) {
            postList.innerHTML = `
                <p style="text-align:center;">
                    Please login to see posts.
                </p>
            `;
            return;
        }

        // বর্তমানে login করা user's UID
        const currentUid = user.uid;

        // users collection থেকে user name নেওয়া
        let userName = user.displayName || "User";

        try {

            const userRef = doc(db, "users", currentUid);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {

                const userData = userSnap.data();

                userName = userData.name || user.displayName || "User";
            }

        } catch (error) {

            console.error("User Name Error:", error);

        }
        // ================= POST QUERY =================

        const postQuery = query(
            collection(db, "posts"),
            where("userId", "==", currentUid)
        );


        const querySnapshot = await getDocs(postQuery);

        postList.innerHTML = "";


        if (querySnapshot.empty) {

            postList.innerHTML = `
                <p style="text-align:center;">
                    No Posts Found
                </p>
            `;

            return;
        }
        // ================= SHOW POSTS =================

        querySnapshot.forEach((docSnap) => {

            const postData = docSnap.data();

            const postId = docSnap.id;

            const postText = escapeHTML(
                postData.text || ""
            );

            const postUserName = escapeHTML(
                postData.userName || userName
            );


            postList.innerHTML += `

                <div
                    class="single-post"
                    style="
                        border:1px solid #ddd;
                        background:white;
                        padding:12px;
                        margin-bottom:10px;
                        border-radius:6px;
                    "
                >

                    <div style="margin-bottom:8px;">

                        <strong>
                            ${postUserName}
                        </strong>

                        <br>

                    </div>


                    <div
                        style="
                            padding:8px 0;
                            word-wrap:break-word;
                        "
                    >
                        ${postText}
                    </div>


                    <button
                        class="delete-btn"
                        onclick="window.deletePost('${postId}')"
                    >
                        Delete
                    </button>

                </div>
            `;

        });


    } catch (error) {

        console.error("Load Posts Error:", error);

        postList.innerHTML = `
            <p style="color:red;text-align:center;">
                Posts load failed.
            </p>
        `;

    }

}
// ================= SAVE POST =================

window.SavePost = async function() {

    const inputField =
        document.getElementById("postText");

    const text =
        inputField.value.trim();


    if (text === "") {

        alert("Post লিখুন।");

        return;
    }

    // Firebase current user
    const user = auth.currentUser;


    // Login check
    if (!user) {

        alert("আগে Login করুন।");

        return;
    }

    try {
        // Firebase User ID
        const userId = user.uid;


        // Default name
        let userName =
            user.displayName || "User";


        // users collection থেকে name নেওয়া
        const userRef =
            doc(db, "users", userId);

        const userSnap =
            await getDoc(userRef);


        if (userSnap.exists()) {

            const userData =
                userSnap.data();

            userName =
                userData.name ||
                user.displayName ||
                "User";
        }
        // ================= FIRESTORE SAVE =================

        await addDoc(
            collection(db, "posts"),
            {

                text: text,

                userId: userId,

                userName: userName,

                createdAt: serverTimestamp()

            }
        );
        // Input clear
        inputField.value = "";


        // Message
        alert("Post Successfully Saved");


        // Firebase থেকে আবার Post load
        await displayPosts();


    } catch (error) {

        console.error(
            "Save Post Error:",
            error
        );

        alert(
            "Post Save Failed: " +
            error.message
        );

    }

};
// ================= DELETE POST =================

window.deletePost = async function(postId) {

    if (
        !confirm(
            "আপনি কি এই Post Delete করতে চান?"
        )
    ) {
        return;
    }


    try {

        // Current Firebase user
        const user =
            auth.currentUser;


        // Login check
        if (!user) {

            alert("আগে Login করুন।");

            return;
        }

        // Firebase থেকে Post document ধরা
        const postRef =
            doc(db, "posts", postId);


        const postSnap =
            await getDoc(postRef);


        // Post আছে কিনা
        if (!postSnap.exists()) {

            alert("Post পাওয়া যায়নি।");

            return;
        }

        // Post data
        const postData =
            postSnap.data();


        // ================= OWNER CHECK =================

        if (
            postData.userId !== user.uid
        ) {

            alert(
                "এই Post আপনি Delete করতে পারবেন না।"
            );

            return;
        }

        // ================= DELETE =================

        await deleteDoc(postRef);

        alert(
            "Post Deleted Successfully"
        );


        // List আবার load
        await displayPosts();


    } catch (error) {

        console.error(
            "Delete Post Error:",
            error
        );

        alert(
            "Delete Failed: " +
            error.message
        );
    }
};
// ================= SAVE BUTTON =================

const saveBtn =
    document.getElementById("SavePost");


if (saveBtn) {

    saveBtn.addEventListener(
        "click",
        window.SavePost
    );

}
// ================= LOAD POSTS AFTER LOGIN =================//

onAuthStateChanged(
    auth,
    async (user) => {

        if (user) {

            await displayPosts();

        }
    }
);






/* =====================================================
   CLOUDINARY CONFIG
===================================================== */
const CLOUD_NAME = "sykfzqhs"; // Cloudinary থেকে আপনার Cloud Name বসান
const UPLOAD_PRESET = "robiul_preset"; // Unsigned Upload Preset এর নাম বসান

/* =====================================================
   UPLOAD VIDEO TO CLOUDINARY & SAVE TO FIRESTORE
===================================================== */
const uploadBtn = document.getElementById("btnop");

if (uploadBtn) {
    uploadBtn.addEventListener("click", async () => {
        const videoInput = document.getElementById("videoInput");
        const captionText = document.getElementById("captionText");
        const status = document.getElementById("status");

        const file = videoInput.files[0];
        const caption = captionText.value.trim();

        if (!file) {
            alert("অনুগ্রহ করে একটি ভিডিও ফাইল সিলেক্ট করুন।");
            return;
        }

        const user = auth.currentUser;
        if (!user) {
            alert("আগে Login করুন।");
            return;
        }

        try {
            status.textContent = "Uploading video to Cloudinary...";

            // 1. Get User Name from Firestore
            let userName = user.displayName || "User";
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {
                userName = userSnap.data().name || userName;
            }

            // 2. Upload Video to Cloudinary
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", UPLOAD_PRESET);

            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
                method: "POST",
                body: formData
            });

            const cloudinaryData = await res.json();

            if (!res.ok) {
                throw new Error(cloudinaryData.error?.message || "Cloudinary Upload Failed");
            }

            const videoUrl = cloudinaryData.secure_url;

            // 3. Save Data to Firestore "videos" Collection
            status.textContent = "Saving details to Database...";

            await addDoc(collection(db, "videos"), {
                videoUrl: videoUrl,
                caption: caption,
                userId: user.uid,
                userName: userName,
                createdAt: serverTimestamp()
            });

            status.textContent = "Video uploaded successfully!";
            captionText.value = "";
            videoInput.value = "";

            alert("Video Uploaded Successfully!");
            displayVideos(); // Refresh Video List

        } catch (error) {
            console.error("Video Upload Error:", error);
            status.textContent = "Upload Failed!";
            alert("Upload Failed: " + error.message);
        }
    });
}

/* =====================================================
   LOAD & DISPLAY VIDEOS
===================================================== */
async function displayVideos() {
    const videoList = document.getElementById("videoList");
    if (!videoList) return;

    try {
        const user = auth.currentUser;
        if (!user) {
            videoList.innerHTML = `<p style="text-align:center;">Please login to see videos.</p>`;
            return;
        }

        const videoQuery = query(
            collection(db, "videos"),
            where("userId", "==", user.uid)
        );

        const querySnapshot = await getDocs(videoQuery);
        videoList.innerHTML = "";

        if (querySnapshot.empty) {
            videoList.innerHTML = `<p style="text-align:center;">No Videos Found</p>`;
            return;
        }

        querySnapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const videoId = docSnap.id;

            const safeCaption = escapeHTML(data.caption || "");
            const safeUserName = escapeHTML(data.userName || "User");

            videoList.innerHTML += `
                <div class="single-video" style="border:1px solid #ddd; background:white; padding:12px; margin-bottom:15px; border-radius:6px;">
                    <div style="margin-bottom:8px;">
                        <strong>${safeUserName}</strong>
                    </div>
                    ${safeCaption ? `<p style="margin:5px 0;">${safeCaption}</p>` : ''}
                    <video src="${escapeHTML(data.videoUrl)}" controls style="width:100%; max-height:350px; border-radius:6px; background:#000;"></video>
                    <br><br>
                    <button class="delete-btn" onclick="window.deleteVideo('${videoId}')">Delete Video</button>
                </div>
            `;
        });

    } catch (error) {
        console.error("Load Videos Error:", error);
        videoList.innerHTML = `<p style="color:red;text-align:center;">Failed to load videos.</p>`;
    }
}

/* =====================================================
   DELETE VIDEO
===================================================== */
window.deleteVideo = async function(videoId) {
    if (!confirm("আপনি কি এই Video ডিলিট করতে চান?")) return;

    try {
        const user = auth.currentUser;
        if (!user) {
            alert("আগে Login করুন।");
            return;
        }

        const videoRef = doc(db, "videos", videoId);
        const videoSnap = await getDoc(videoRef);

        if (!videoSnap.exists()) {
            alert("Video পাওয়া যায়নি।");
            return;
        }

        if (videoSnap.data().userId !== user.uid) {
            alert("এই Video আপনি Delete করতে পারবেন না।");
            return;
        }

        await deleteDoc(videoRef);
        alert("Video Deleted Successfully");
        await displayVideos();

    } catch (error) {
        console.error("Delete Video Error:", error);
        alert("Delete Failed: " + error.message);
    }
};

/* =====================================================
   AUTH STATE UPDATES
===================================================== */
onAuthStateChanged(auth, async (user) => {
    if (user) {
        await displayPosts();
        await displayVideos();
    }
});
