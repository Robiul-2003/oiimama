/* ================ FIRESTORE POST SYSTEM============================= */// ================= LOAD POSTS =================
function makePostLinks(text) {

    // HTML Safe করা (XSS Prevention)
    text = escapeHTML(text);

    // ১. http:// বা https:// সহ URL
    text = text.replace(
        /(https?:\/\/[^\s<]+?)([.,!?)]?)(?=\s|$)/gi,
        '<a href="$1" target="_blank" rel="noopener noreferrer" class="hashtag-link">$1</a>$2'
    );

    // ২. www. দিয়ে শুরু হওয়া URL (যদি http/https না থাকে)
    text = text.replace(
        /(^|[^\/])(www\.[^\s<]+?)([.,!?)]?)(?=\s|$)/gi,
        '$1<a href="http://$2" target="_blank" rel="noopener noreferrer" class="hashtag-link">$2</a>$3'
    );

    // ৩. Hashtag (#)
    text = text.replace(
        /#(?!www\.)(?![a-zA-Z0-9_-]+\.[a-zA-Z]{2,})([a-zA-Z0-9_\u0980-\u09FF]+)/gi,
        '<a class="hashtag-link" href="hashtag.html?tag=$1" class="hashtag-link">#$1</a>'
    );

    return text;
}

/* ================= USER PAGE LIKE & VIEW ================= */

function bindUserVideoActions(card) {

    const user = auth.currentUser;
    if (!user) return;

    const videoId = card.dataset.videoId;

    const videoRef = doc(db, "videos", videoId);
    const likeId = videoId + "_" + user.uid;
    const viewId = videoId + "_" + user.uid;

    const likeRef = doc(db, "videoLikes", likeId);
    const viewRef = doc(db, "videoViews", viewId);

    const likeBtn = card.querySelector(".btn-like");
    const viewNum = card.querySelector(".view-count");
    const likeNum = card.querySelector(".like-num");
    const video = card.querySelector("video");

    if (!likeBtn || !video || !viewNum || !likeNum) return;

    // ভিডিওর Like ও View Count Live Update
    onSnapshot(videoRef, (snap) => {

        if (!snap.exists()) return;

        const data = snap.data();

        likeNum.textContent = data.likeCount || 0;
       viewNum.textContent = data.viewCount || 0;

    }, (error) => {
        console.error("Video Count Error:", error);
    });

    // নিজের Like Status Live Update
    onSnapshot(likeRef, (snap) => {

        const icon = likeBtn.querySelector("i");

        if (snap.exists()) {
            icon.className = "fa-solid fa-thumbs-up";
            likeBtn.classList.add("liked");
        } else {
            icon.className = "fa-regular fa-thumbs-up";
            likeBtn.classList.remove("liked");
        }

    }, (error) => {
        console.error("Like Status Error:", error);
    });

    // LIKE / UNLIKE
    likeBtn.addEventListener("click", async () => {

        const currentUser = auth.currentUser;

        if (!currentUser || currentUser.isAnonymous) {
            alert("Like করতে Login করুন।");
            return;
        }

        likeBtn.disabled = true;

        try {

            await runTransaction(db, async (transaction) => {

                const likeSnap = await transaction.get(likeRef);
                const videoSnap = await transaction.get(videoRef);

                if (!videoSnap.exists()) {
                    throw new Error("Video পাওয়া যায়নি।");
                }

                const currentCount =
                    videoSnap.data().likeCount || 0;

                if (likeSnap.exists()) {

                    // UNLIKE
                    if (currentCount <= 0) {
                        throw new Error("Like Count ঠিক নেই।");
                    }

                    transaction.delete(likeRef);

                    transaction.update(videoRef, {
                        likeCount: currentCount - 1
                    });

                } else {

                    // LIKE
                    transaction.set(likeRef, {
                        videoId: videoId,
                        userId: currentUser.uid,
                        createdAt: serverTimestamp()
                    });

                    transaction.update(videoRef, {
                        likeCount: currentCount + 1
                    });
                }
            });

        } catch (error) {

            console.error("Like Error:", error);
            alert("Like করতে সমস্যা হয়েছে: " + error.message);

        } finally {
            likeBtn.disabled = false;
        }
    });

    // VIEW COUNT: ৩ সেকেন্ড দেখলে একবার গণনা
    video.addEventListener("timeupdate", async () => {

        if (video.currentTime < 3) return;
        if (card.dataset.viewAttempted === "true") return;

        const currentUser = auth.currentUser;

        if (!currentUser || currentUser.isAnonymous) return;

        card.dataset.viewAttempted = "true";

        try {

            await runTransaction(db, async (transaction) => {

                const viewSnap = await transaction.get(viewRef);
                const videoSnap = await transaction.get(videoRef);

                if (viewSnap.exists()) return;

                if (!videoSnap.exists()) {
                    throw new Error("Video পাওয়া যায়নি।");
                }

                const currentCount =
                    videoSnap.data().viewCount || 0;

                transaction.set(viewRef, {
                    videoId: videoId,
                    userId: currentUser.uid,
                    createdAt: serverTimestamp()
                });

                transaction.update(videoRef, {
                    viewCount: currentCount + 1
                });
            });

        } catch (error) {

            card.dataset.viewAttempted = "false";
            console.error("View Count Error:", error);

        }
    });
}

// Comment Box Open
window.commentopen = function(btn) {

    const card = btn.closest(".single-video");
    if (!card) return;

    const box = card.querySelector(".commentbox");

    box.style.display = "flex";

    const videoId = card.dataset.videoId;

    loadUserComments(videoId, card);
};


// Comment Box Close
window.commentclose = function(btn) {

    const card = btn.closest(".single-video");
    if (!card) return;

    const box = card.querySelector(".commentbox");

    box.style.display = "none";

    // Listener বন্ধ
    if (card.commentUnsubscribe) {
        card.commentUnsubscribe();
        card.commentUnsubscribe = null;
    }
};


// Load Comments From Firebase
window.loadUserComments = function(videoId, card) {

    // আগের listener বন্ধ
    if (card.commentUnsubscribe) {
        card.commentUnsubscribe();
    }

    const commentList = card.querySelector(".comment-list");

    const commentsRef = collection(
        db,
        "videos",
        videoId,
        "comments"
    );

    const commentsQuery = query(
        commentsRef,
        orderBy("createdAt", "asc")
    );

    card.commentUnsubscribe = onSnapshot(
        commentsQuery,

        (snapshot) => {

            commentList.innerHTML = "";

            if (snapshot.empty) {
                commentList.innerHTML =
                    '<p style="text-align:center;">No comments yet.</p>';
                return;
            }

            snapshot.forEach((commentDoc) => {

                const data = commentDoc.data();

                const userName = escapeHTML(data.userName || "User");
                const commentText = escapeHTML(data.text || "");

                const div = document.createElement("div");

                div.className = "user-comment";

                div.innerHTML = `
                    <strong>${userName}</strong>
                    <p>${commentText}</p>
                `;

                commentList.appendChild(div);
            });
        },

        (error) => {
            console.error("Comment Load Error:", error);
        }
    );
};


// Send Comment
window.sendUserComment = async function(btn) {

    const card = btn.closest(".single-video");
    if (!card) return;

    const videoId = card.dataset.videoId;

    const input = card.querySelector(".inputtext");

    const text = input.value.trim();

    if (!text) {
        alert("Comment লিখুন।");
        return;
    }

    const user = auth.currentUser;

    if (!user || user.isAnonymous) {
        alert("Comment করতে Login করুন।");
        return;
    }

    try {

        btn.disabled = true;

        // User Name Load
        let userName = user.displayName || "User";

        const userRef = doc(db, "users", user.uid);

        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
            userName = userSnap.data().name || userName;
        }

        // Save Comment
        await addDoc(
            collection(db, "videos", videoId, "comments"),
            {
                videoId: videoId,
                userId: user.uid,
                userName: userName,
                text: text,
                createdAt: serverTimestamp()
            }
        );

        input.value = "";

    } catch (error) {

        console.error("User Page Comment Error:", error);

        alert("Comment Failed: " + error.message);

    } finally {

        btn.disabled = false;
    }
};

/* =====DELETE VIDEO============= */
window.deleteVideo = async function(videoId) {
    if (!confirm("আপনি কি এই Video ডিলিট করতে চান?")) return;

    try {
        const user = auth.currentUser;
        if (!user) {
            alert("আগে Login করুন।");
            return;
        }

        const videoRef = doc(db, "videos", videoId);
        const videoSnap = await getDoc(videoRef);

        if (!videoSnap.exists()) {
            alert("Video পাওয়া যায়নি।");
            return;
        }

        if (videoSnap.data().userId !== user.uid) {
            alert("এই Video আপনি Delete করতে পারবেন না।");
            return;
        }

        await deleteDoc(videoRef);
        alert("Video Deleted Successfully");
        await displayVideos();

    } catch (error) {
        console.error("Delete Video Error:", error);
        alert("Delete Failed: " + error.message);
    }
};


/* ================ share button ====================== */
window.shareContent = async function(title, text, url) {
  try {
    // Web Share API support check (Mobile Browsers & WebView)
    if (navigator.share) {
      await navigator.share({
        title: title || 'Check this out!',
        text: text || '',
        url: url
      });
      return;
    }

    // Capacitor Native Share (Android/iOS App fallback)
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share) {
      await window.Capacitor.Plugins.Share.share({
        title: title,
        text: text,
        url: url,
        dialogTitle: "Share Content"
      });
      return;
    }

    // Fallback for Desktop Browsers (Clipboard Copy)
    if (navigator.clipboard) {
      await navigator.clipboard.writeText(url);
      alert("Link copied to clipboard!");
      return;
    }

    alert("Sharing is not supported on this browser.");

  } catch (error) {
    // User share cancel করলে AbortError আসে, যা ইগনোর করা ভালো
    if (error.name !== 'AbortError') {
      console.error("Share Error:", error);
    }
  }
};
