<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test 2</title>
</head>
<body>

    <input type="file" id="imgfile" accept="image/*">
    <img id="hello" style="width:300px">

    <script>
      // ইমেজ আপলোড লজিক
      const one = document.getElementById("imgfile");
      const two = document.getElementById("hello");

      one.addEventListener("change", function () {
          const three = this.files[0];

          if (three) {
              two.src = URL.createObjectURL(three);
          }
      });

      // Capacitor ব্যাক বাটন লজিক (test2 পেজেও থাকতে হবে)
      document.addEventListener('DOMContentLoaded', () => {
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
          const { App } = window.Capacitor.Plugins;

          App.addListener('backButton', () => {
            if (window.history.length > 1) {
              window.history.back();
            } else {
              App.exitApp();
            }
          });
        }
      });
    </script>
</body>
</html>
