<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Text</title>
</head>
<body>

  <input id="postText" type="text" placeholder="Create post">
  <button onclick="inputtext()">Save</button>

  <p id="showtext"></p>

  <script>
    function inputtext() {
      let text = document.getElementById("postText").value;

      // # দিয়ে শুরু হওয়া শব্দকে link বানাবে
      text = text.replace(
        /#([a-zA-Z0-9_]+)/g,
        '<a href="hashtag.html?tag=$1">#$1</a>'
      );

      document.getElementById("showtext").innerHTML = text;
    }
  </script>

</body>
</html>
