<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <title>Document</title>

    <style>
        .fa-rotate-right {
            width: 40px;
            height: 40px;
            background: rgb(218, 211, 211);
            border-radius: 50%;
            display: none; /* শুরুতে hidden */
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;

            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
        }
    </style>
</head>

<body>

    <!-- Refresh icon -->
    <i id="refreshIcon"
       class="fa-solid fa-rotate-right"
       onclick="location.reload()"></i>

    <h1>one</h1>
    <h2>two</h2>
    <h3>three</h3>
    <h4>four</h4>
    <h5>five</h5>
    <h6>six</h6>


<script>

let startY = 0;

document.addEventListener("touchstart", function(e) {

    // শুধু page-এর একদম top থেকে gesture শুরু হলে
    if (window.scrollY === 0) {
        startY = e.touches[0].clientY;
    }

});


document.addEventListener("touchmove", function(e) {

    if (window.scrollY !== 0) return;

    let currentY = e.touches[0].clientY;
    let distance = currentY - startY;

    // নিচের দিকে 20px টানলে icon দেখাবে
    if (distance > 20) {

        document.getElementById("refreshIcon").style.display = "flex";

    }

});


document.addEventListener("touchend", function(e) {

    if (window.scrollY !== 0) return;

    let endY = e.changedTouches[0].clientY;
    let distance = endY - startY;

    // 120px টানলে reload
    if (distance > 120) {

        location.reload();

    } else {

        // আবার hidden
        document.getElementById("refreshIcon").style.display = "none";

    }

    startY = 0;

});

</script>

</body>
</html>
