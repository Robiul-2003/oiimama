      </div>
    `;
  });
}

function searchProduct(){
  let input1 = document.getElementById("search") ? document.getElementById("search").value.toLowerCase().trim() : "";
  let input2 = document.getElementById("ONEsearch") ? document.getElementById("ONEsearch").value.toLowerCase().trim() : "";
  let input = input1 || input2;
  
  if (input === "") {
    renderProducts(window.allProducts);
    return;
  }

  let filtered = window.allProducts.filter(p => {
    let nameMatch = p.name ? p.name.toLowerCase().includes(input) : false;
    let codeMatch = p.code ? String(p.code).toLowerCase().includes(input) : false;
    return nameMatch || codeMatch;
  });
  
  renderProducts(filtered);
}

function openModal(id){
  let p = window.allProducts.find(x => String(x.id) === String(id));
  if(!p) return;
  
  window.currentProduct = p;

  document.getElementById("modal").style.display="block";
  document.getElementById("mainImg").src = (p.images && p.images[0]) ? p.images[0] : 'logo.png';
  document.getElementById("pname").innerText = p.name;
  document.getElementById("pcolor").innerText ="Color: " + (Array.isArray(p.color) ? p.color.join(", ") : (p.color || "N/A"));
  document.getElementById("psize").innerText ="Size: " + (Array.isArray(p.size) ? p.size.join(", ") : (p.size || "N/A"));

  if(p.ppieces && Array.isArray(p.ppieces)) {
    document.getElementById("ppieces").innerHTML = p.ppieces.map(x => `<span>${x}</span>`).join("");
  } else {
    document.getElementById("ppieces").innerHTML = "<span>Standard</span>";
  }
  
  if(p.price && Array.isArray(p.price)) {
    document.getElementById("pprice").innerHTML = p.price.map(x => `<span>${x}</span>`).join("");
  } else {
    document.getElementById("pprice").innerHTML = `<span>${p.price} TK</span>`;
  }
  
  document.getElementById("pdetails").innerText = p.details || '';
  
  let thumbs = document.getElementById("thumbs");
  thumbs.innerHTML = "";
  if(p.images && Array.isArray(p.images)){
    p.images.forEach(img => {
      thumbs.innerHTML += `<img src="${img}" onclick="document.getElementById('mainImg').src='${img}'">`;
    });
  }
}

function closeModal(){ document.getElementById("modal").style.display="none"; }

function checkLogin(){
    let number = document.getElementById("number").value.trim();
    let pin = document.getElementById("pin").value.trim();
    if(number === "123456789" && pin === "2025"){
        window.location.href = "add.html";
    }else{
        alert("Wrong Number or PIN");
    }
}

function filterProducts(category){
  if(category === "all") {
    renderProducts(window.allProducts);
  } else {
    let filtered = window.allProducts.filter(p => {
      if(Array.isArray(p.category)){
        return p.category.includes(category);
      }
      return p.category === category;
    });
    renderProducts(filtered);
  }
}

function orderNow() {

  const p = window.currentProduct;

  if (!p) {
    alert("Product not found");
    return;
  }

  const whatsapp = p.Whatsapp;

  if (!whatsapp) {
    alert("Seller WhatsApp number not found.");
    return;
  }

  const message = `🛒 New Order

📦 Product: ${p.name}
💰 Price: ${Array.isArray(p.price) ? p.price[0] : p.price}`;

  window.open(
    `https://wa.me/${whatsapp}?text=${encodeURIComponent(message)}`,
    "_blank"
  );
}
window.orderNow = orderNow;

async function loadFirebaseProducts() {
  try {
    const querySnapshot = await getDocs(collection(db, "products"));
    querySnapshot.forEach((doc) => {
      let p = doc.data();
      if(!p.id) p.id = doc.id; 
      if (!window.allProducts.some(x => String(x.id) === String(p.id))) {
         window.allProducts.push(p);
      }
    });
    renderProducts(window.allProducts);
  } catch (error) {
    console.error("Error loading products: ", error);
  }
}
// গ্লোবাল ফাংশন
window.openModal = openModal;
window.closeModal = closeModal;
window.checkLogin = checkLogin;
window.searchProduct = searchProduct;
window.filterProducts = filterProducts;
window.searchicon = searchicon;
window.searchclose = searchclose;
window.orderNow = orderNow;
// প্রাথমিক লোড
renderProducts(window.allProducts);
loadFirebaseProducts();
</script>
