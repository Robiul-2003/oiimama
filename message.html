<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages</title>
<style>
  body { font-family:sans-serif; background:#f0f2f5; margin:0; }
  .top { background:#075e54; color:#fff; padding:16px; font-size:18px; }
  .chat-item {
    background:#fff; padding:12px; display:flex; gap:12px;
    border-bottom:1px solid #eee; cursor:pointer;
  }
  .chat-item img { width:50px; height:50px; border-radius:50%; object-fit:cover; }
  .chat-item .info { flex:1; }
  .chat-item .info h4 { margin:0; font-size:15px; }
  .chat-item .info p { margin:4px 0 0; font-size:13px; color:#666;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px;}
  .chat-item .time { font-size:11px; color:#999; }
</style>
</head>
<body>

<div class="top">Messages</div>
<div id="chatList"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, collection, query, where, orderBy, onSnapshot 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB9Ed_6mJEZ_fhITCrf-d9P6KlgpQBLD14",
  authDomain: "robiul-84377.firebaseapp.com",
  projectId: "robiul-84377",
  storageBucket: "robiul-84377.firebasestorage.app",
  messagingSenderId: "476907665212",
  appId: "1:476907665212:web:b4dc619f0290a2241b1039"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

onAuthStateChanged(auth, user => {
  if (!user) { window.location.href = "login.html"; return; }
  loadChats(user.uid);
});

function loadChats(uid) {
  const q = query(
    collection(db, "chats"),
    where("members", "array-contains", uid),
    orderBy("lastTime", "desc")
  );

  onSnapshot(q, snap => {
    const box = document.getElementById("chatList");
    box.innerHTML = "";

    if (snap.empty) {
      box.innerHTML = "<p style='padding:20px;text-align:center;color:#888'>No chats yet</p>";
      return;
    }

    snap.forEach(d => {
      const c = d.data();
      const otherUid = c.members.find(x => x !== uid);
      const other = c.membersInfo?.[otherUid] || { name: "User" };
      const time = c.lastTime?.toDate 
        ? c.lastTime.toDate().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
        : "";

      box.innerHTML += `
        <div class="chat-item" onclick="location.href='chat.html?chatId=${d.id}'">
          <img src="user.png">
          <div class="info">
            <h4>${other.name}</h4>
            <p>${c.lastMessage || c.productName || ''}</p>
          </div>
          <div class="time">${time}</div>
        </div>
      `;
    });
  });
}
</script>
</body>
</html>
