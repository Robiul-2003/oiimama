<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<title>Messages</title>
<style>
  body { font-family:sans-serif; background:#e5e7ea; margin:0; }
  .header1 { max-width:1000px; margin:auto; background:white; border-bottom:1px solid rgb(239, 234, 234); }
  .headone { justify-content: space-between; align-items: center; display: flex; }
  .name { font-size: 20px; padding: 10px; color: #031f50; font-weight: bold; cursor: pointer; }
  .fa-list { font-size:20px; margin-right:5%; cursor: pointer; }
  .headtwo { height:50px; display:flex; align-items:center; margin-top:0; }
  
  #homeimg { width: 35px; height: 28px; margin-left: 2%; cursor: pointer; }
  #pentoimg { width: 32px; height: 30px; margin-left:12%; cursor: pointer; }
  #videoimg { width: 36px; height: 32px; margin-left:20%; cursor: pointer; }
  #bellimg { width: 30px; height: 30px; margin-left: auto; margin-right:12%; cursor: pointer; }
  #userimg { width: 28px; height: 28px; margin-right: 2%; cursor: pointer; }

  .msg-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    background-color: #3a3b3c;
    border-radius: 50%;
    margin-left: 12%;
    cursor: pointer;
  }
  
  .msg-wrap #messageimg { 
    width: 22px; 
    height: 22px; 
    margin: 0; 
    filter: brightness(0) invert(1); 
  }
  
  .msg-badge {
    position: absolute;
    top: -2px;
    right: -4px;
    background: #e41e3f;
    color: #fff;
    font-size: 11px;
    font-weight: bold;
    min-width: 20px;
    height: 20px;
    border-radius: 10px;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    border: 2px solid #fff;
    box-sizing: border-box;
    line-height: 1;
  }

  .chat-item { max-width:975px; margin:auto; background:#fff; padding:12px; display:flex; gap:12px; border-bottom:1px solid rgb(239, 234, 234); cursor:pointer; align-items: center; }
  .chat-item img { width:35px; height:35px; border-radius:50%; object-fit:cover;}
  .chat-item .info { flex:1; }
  .chat-item .info h4 { margin:0; font-size:15px; }
  .chat-item .info p { margin:4px 0 0; font-size:13px; color:#666; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px;}
  
  .chat-item .time { font-size:11px; color:#999; }
  .chat-item .time.unread-time { color: #e41e3f; font-weight: bold; }

  /* 🔴 আনরিড মেসেজের লাল ডট */
  .red-dot {
    width: 9px;
    height: 9px;
    background-color: #e41e3f;
    border-radius: 50%;
    display: inline-block;
    margin-top: 5px;
  }

  @media(max-width:600px){
    #homeimg { width: 35px; height: 28px; margin-left: 2%; }
    #pentoimg { width: 32px; height: 30px; margin-left: 10%; }
    #videoimg { width: 36px; height: 32px; margin-left: 8%; }
    #bellimg { width: 30px; height: 30px; margin-left: auto; margin-right:7%; }
    #userimg { width: 28px; height: 28px; margin-right: 2%; }
    .msg-wrap { margin-left: 10%; }
  }
</style>
</head>
<body>
  <div class="header1">
    <div class="headone">
      <span class="name">ADARSHA</span>
      <i class="fa-solid fa-list" onclick="window.location.href='list.html'" id="list"></i>
    </div>
    <div class="headtwo">
      <img src="home.png" id="homeimg" onclick="window.location.href='index.html'">
      <img src="pento.png" id="pentoimg" onclick="window.location.href='post.html'">

      <div class="msg-wrap" onclick="window.location.href='message.html'">
        <img src="message.png" id="messageimg">
        <span class="msg-badge" id="msgBadge">0</span>
      </div>

      <img src="VIDEO.png" id="videoimg" onclick="window.location.href='vedio.html'">
      <img src="bell.png" id="bellimg">
      <img src="user.png" id="userimg" onclick="window.location.href='user.html'">
    </div>
  </div>

<div id="chatList"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  query,
  where,
  onSnapshot,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getMessaging,
  getToken,
  onMessage,
  isSupported
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyB9Ed_6mJEZ_fhITCrf-d9P6KlgpQBLD14",
  authDomain: "robiul-84377.firebaseapp.com",
  projectId: "robiul-84377",
  storageBucket: "robiul-84377.firebasestorage.app",
  messagingSenderId: "476907665212",
  appId: "1:476907665212:web:b4dc619f0290a2241b1039"
};

const VAPID_KEY = "BGhwKO6KN6oSk7S8DqjF4xUzJudhektpCkqP8MlkpEP3WyyaXyZ5IAsVYR0wnhxaeD99E0A9bpxLN0gVjPHAE-I";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let messaging = null;
let unsubscribeChats = null;
let unsubscribeUnread = null;

function updateMsgBadge(count) {
  const badge = document.getElementById("msgBadge");
  if (!badge) return;

  const total = Math.max(0, Number(count) || 0);
  badge.textContent = total > 99 ? "99+" : String(total);
  badge.style.display = total > 0 ? "flex" : "none";
}

function listenUnreadCount(uid) {
  if (unsubscribeUnread) {
    unsubscribeUnread();
  }

  const chatsQuery = query(
    collection(db, "chats"),
    where("members", "array-contains", uid)
  );

  unsubscribeUnread = onSnapshot(
    chatsQuery,
    (snapshot) => {
      let total = 0;
      snapshot.forEach((chatDoc) => {
        const data = chatDoc.data();
        const unreadCount = data.unreadCount;
        if (unreadCount && typeof unreadCount[uid] === "number") {
          total += Math.max(0, unreadCount[uid]);
        }
      });
      updateMsgBadge(total);
    },
    (error) => {
      console.error("Unread count error:", error);
    }
  );
}

function loadChats(uid) {
  if (unsubscribeChats) {
    unsubscribeChats();
  }

  const chatsQuery = query(
    collection(db, "chats"),
    where("members", "array-contains", uid)
  );

  unsubscribeChats = onSnapshot(
    chatsQuery,
    (snapshot) => {
      const box = document.getElementById("chatList");
      if (!box) return;

      if (snapshot.empty) {
        box.innerHTML = `<p style="padding:20px;text-align:center;color:#888">No chats yet</p>`;
        return;
      }

      const chats = [];
      snapshot.forEach((chatDoc) => {
        chats.push({
          id: chatDoc.id,
          ...chatDoc.data()
        });
      });

      // ✅ বিয়োগফলের মাধ্যমে সঠিক সর্টিং
      chats.sort((a, b) => {
        const timeA = a.lastTime?.toMillis ? a.lastTime.toMillis() : 0;
        const timeB = b.lastTime?.toMillis ? b.lastTime.toMillis() : 0;
        return timeB - timeA;
      });

      box.replaceChildren();

      chats.forEach((chat) => {
        const otherUid = (chat.members || []).find(
          (memberUid) => memberUid !== uid
        );

        const other = chat.membersInfo?.[otherUid] || {};
        const unread = Number(chat.unreadCount?.[uid]) || 0;

        const item = document.createElement("div");
        item.className = "chat-item";

        const avatar = document.createElement("img");
        avatar.src = "user.png";
        avatar.alt = "User";

        const info = document.createElement("div");
        info.className = "info";

        const name = document.createElement("h4");
        name.textContent = other.name || "User";

        const preview = document.createElement("p");
        preview.textContent = chat.lastMessage || chat.productName || "";

        if (unread > 0) {
          name.style.fontWeight = "bold";
          preview.style.fontWeight = "bold";
        }

        info.append(name, preview);

        const right = document.createElement("div");
        right.style.textAlign = "right";
        right.style.display = "flex";
        right.style.flexDirection = "column";
        right.style.alignItems = "flex-end";

        const time = document.createElement("div");
        time.className = "time" + (unread > 0 ? " unread-time" : "");
        time.textContent = chat.lastTime?.toDate
          ? chat.lastTime.toDate().toLocaleTimeString([], {
              hour: "2-digit",
              minute: "2-digit"
            })
          : "";

        right.appendChild(time);

        if (unread > 0) {
          const redDot = document.createElement("div");
          redDot.className = "red-dot";
          right.appendChild(redDot);
        }

        item.append(avatar, info, right);

        item.addEventListener("click", () => {
          location.href = "chat.html?chatId=" + encodeURIComponent(chat.id);
        });

        box.appendChild(item);
      });
    },
    (error) => {
      console.error("Chat list error:", error);
    }
  );
}

async function registerServiceWorker() {
  if (!("serviceWorker" in navigator)) return null;
  try {
    return await navigator.serviceWorker.register("/firebase-messaging-sw.js");
  } catch (error) {
    console.error("Service worker error:", error);
    return null;
  }
}

async function setupNotifications(uid) {
  try {
    if (!("Notification" in window)) return;
    if (!("serviceWorker" in navigator)) return;
    if (Notification.permission === "denied") return;

    const supported = await isSupported();
    if (!supported) return;

    messaging = getMessaging(app);

    onMessage(messaging, (payload) => {
      console.log("Foreground message:", payload);
    });

    if (Notification.permission !== "granted") {
      return;
    }

    const registration = await navigator.serviceWorker.ready;
    const token = await getToken(messaging, {
      vapidKey: VAPID_KEY,
      serviceWorkerRegistration: registration
    });

    if (token) {
      await setDoc(
        doc(db, "users", uid),
        { fcmToken: token },
        { merge: true }
      );
    }
  } catch (error) {
    console.error("Notification setup error:", error);
  }
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    updateMsgBadge(0);
    location.href = "login.html";
    return;
  }

  loadChats(user.uid);
  listenUnreadCount(user.uid);

  await registerServiceWorker();
  await setupNotifications(user.uid);
});
</script>
</body>
</html>
