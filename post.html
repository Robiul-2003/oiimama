<body>
 <header>
  <div class="header1">
    <div class="headone">
      <span class="name">ADARSHA </span>  <i class="fa-solid fa-magnifying-glass" onclick="searchicon()"></i> <i class="fa-solid fa-list" onclick="window.location.href='list.html'" id="list"></i>

      <input id="search" placeholder="Search product ... ." onkeyup="searchProduct()">

    </div>

</header>

<div id="postList"></div>

<script type="module">
/* =====================================================
   FIREBASE IMPORT
===================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

/* =====================================================
   FIREBASE CONFIG
===================================================== */
const firebaseConfig = {
    apiKey: "AIzaSyB9Ed_6mJEZ_fhITCrf-d9P6KlgpQBLD14",
    authDomain: "robiul-84377.firebaseapp.com",
    projectId: "robiul-84377",
    storageBucket: "robiul-84377.firebasestorage.app",
    messagingSenderId: "476907665212",
    appId: "1:476907665212:web:874ccf5a0f2825f71b1039"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* =====================================================
   HELPER FUNCTIONS
===================================================== */
function escapeHTML(value){
    if(value === null || value === undefined) return "";
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

// টেক্সটের ভেতরের লিংক ও হ্যাশট্যাগ অটোমেটিক সক্রিয় করার জন্য
function makePostLinks(text) {
    text = escapeHTML(text);

    // ১. http:// বা https:// সহ লিংক
    text = text.replace(
        /(https?:\/\/[^\s<]+?)([.,!?)]?)(?=\s|$)/gi,
        '<a href="$1" target="_blank" rel="noopener noreferrer" class="hashtag-link">$1</a>$2'
    );

    // ২. www. দিয়ে শুরু হওয়া লিংক (যদি http না থাকে)
    text = text.replace(
        /(^|[^\/])(www\.[^\s<]+?)([.,!?)]?)(?=\s|$)/gi,
        '$1<a href="http://$2" target="_blank" rel="noopener noreferrer" class="hashtag-link">$2</a>$3'
    );

    // ৩. হ্যাশট্যাগ (#)
    text = text.replace(
        /#(?!www\.)(?![a-zA-Z0-9_-]+\.[a-zA-Z]{2,})([a-zA-Z0-9_\u0980-\u09FF]+)/gi,
        '<a class="hashtag-link" href="hashtag.html?tag=$1" class="hashtag-link">#$1</a>'
    );

    return text;
}

/* =====================================================
   LOAD ALL POSTS
===================================================== */
async function displayPosts() {

    const postList = document.getElementById("postList");
    if (!postList) return;

    try {
        const q = query(
            collection(db, "posts"),
            orderBy("createdAt", "desc")
        );

        const querySnapshot = await getDocs(q);
        postList.innerHTML = "";

        if (querySnapshot.empty) {
            postList.innerHTML = `
                <p style="text-align:center;">No Posts Found</p>
            `;
            return;
        }

        querySnapshot.forEach((docSnap) => {
            const postData = docSnap.data();

            // escapeHTML এর বদলে makePostLinks ব্যবহার করা হলো
            const postText = makePostLinks(postData.text || "");
            const postUserName = escapeHTML(postData.userName || "User");

            let dateStr = "";
            if (postData.createdAt && postData.createdAt.toDate) {
                dateStr = postData.createdAt.toDate().toLocaleString();
            }

            postList.innerHTML += `
                <div class="single-post" style="
                    border:1px solid #ddd;
                    background:white;
                    padding:12px;
                    margin-bottom:10px;
                    border-radius:6px;
                ">
                    <div style="margin-bottom:8px;">
                        <strong>${postUserName}</strong>
                        <br>
                        <small style="color:#888;">${escapeHTML(dateStr)}</small>
                    </div>
                    <div style="padding:8px 0; word-wrap:break-word;">
                        ${postText}
                    </div>
                </div>
            `;
        });

    } catch (error) {
        console.error("Load Posts Error:", error);
        postList.innerHTML = `
            <p style="color:red;text-align:center;">
                Posts load failed: ${escapeHTML(error.message)}
            </p>
        `;
    }
}

/* =====================================================
   AUTH STATE → POST LOAD
===================================================== */
onAuthStateChanged(auth, async (user) => {
    if (!user) {
        document.getElementById("postList").innerHTML = `
            <p style="text-align:center;">Please login to see posts.</p>
        `;
        return;
    }
    await displayPosts();
});

</script>
</body>
