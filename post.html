<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>post</title>
</head>
<style>
    /* header */
header{
  background:#031f50; position: fixed;width:100%;top:0;z-index:999;height:60px;left:0;
}
.header1{
  width:1400px;margin: auto;display: flex;justify-content:space-between;color:white;
}
/* search */
#search{
  height:25px;margin-top:10px;
  padding:6px;
  width:600px;
}
.fa-briefcase{
    font-size:25px;margin-top:20px;display:inline-block;
  }
.fa-list{
  font-size:25px;margin-top:20px;cursor: pointer;
}
 .fa-circle-user{
     font-size:25px;margin-top:20px;cursor: pointer;
  }
  .fa-house{
    font-size:25px;margin-top:20px;cursor: pointer;
  }
 .fa-facebook-messenger{
  font-size:25px;margin-top:20px;cursor: pointer;
 }
 .fa-camera{
  font-size:25px;margin-top:20px;cursor: pointer;
 }
    @media(max-width:600px){
  .header1{
    width:100%;
  }
   .fa-house{
    font-size:25px;margin-top:20px;display:inline-block;margin-left:4%;

   .fa-briefcase{

  .fa-magnifying-glass{
   display:inline-block;font-size:23px;margin-top:20px;
  }
  
  #opensearchbox{
    position:fixed;
    top:0;left:0;width:100%;height:60px;
    background:#031f50;display:none;z-index:9999;
  }
  #opensearchbox .search-inner{
   display: flex; justify-content: space-between; align-items: center; padding: 10px;
  }
  #ONEsearch{

  }
 
}
</style>
<body>
  <header>
     <div class="header1">
      <i class="fa-solid fa-house" onclick="window.location.href='index.html'"></i><i class="fa-solid fa-briefcase" onclick="window.location.href='post.html'"></i><i class="fa-solid fa-circle-user" onclick="window.location.href='user.html'"></i>
  <input id="search" placeholder="Search product ..." onkeyup="searchProduct()"><i class="fa-solid fa-camera" onclick="window.location.href='vedio.html'"></i> 
  <i class="fa-solid fa-list" onclick="window.location.href='list.html'" id="list"></i>
  
  </div>
</header>
  </header>
  <div id="showJob"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyB9Ed_6mJEZ_fhITCrf-d9P6KlgpQBLD14",
  authDomain: "robiul-84377.firebaseapp.com",
  projectId: "robiul-84377",
  storageBucket: "robiul-84377.firebasestorage.app",
  messagingSenderId: "476907665212",
  appId: "1:476907665212:web:b4dc619f0290a2241b1039"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const jobBox = document.getElementById("showJob");

const q = query(
  collection(db,"jobs"),
  orderBy("createdAt","desc")
);

onSnapshot(q,(snapshot)=>{
    jobBox.innerHTML="";

    snapshot.forEach(doc=>{
        const data=doc.data();

        jobBox.innerHTML += `
        <div style="border:1px solid #ddd;padding:15px;margin:15px;border-radius:8px">
            <h3>${data.userName}</h3>
            <p>${data.post}</p>
        </div>`;
    });
});
</script>
</body>
</html>
