<script>
    function vedio() {
        document.getElementById("vediocloseo").style.display = "block";
    }

    function veclose() {
        document.getElementById("vediocloseo").style.display = "none";
    }

    function jobs() {
        document.getElementById("job").style.display = "block";
    }

    function jobspost() {
        document.getElementById("job").style.display = "none";
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyB9Ed_6mJEZ_fhITCrf-d9P6KlgpQBLD14",
        authDomain: "robiul-84377.firebaseapp.com",
        projectId: "robiul-84377",
        storageBucket: "robiul-84377.firebasestorage.app",
        messagingSenderId: "476907665212",
        appId: "1:476907665212:web:b4dc619f0290a2241b1039"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const cloudName = "sykfzqhs"; 
    const uploadPreset = "robiul_preset"; 

    const btnShare = document.getElementById('btnop');
    const videoInput = document.getElementById('videoInput');
    const captionInput = document.getElementById('caption');
    const statusText = document.getElementById('status');

    btnShare.addEventListener('click', async function() {
        const file = videoInput.files[0];
        const caption = captionInput.value.trim();
        const user = auth.currentUser;

        if (!file) {
            alert("অনুগ্রহ করে একটি ভিডিও নির্বাচন করুন!");
            return;
        }

        statusText.innerText = "ক্লাউডিনারিতে ভিডিও আপলোড হচ্ছে...";
        btnShare.disabled = true;

        try {
            // ১. Cloudinary-তে ভিডিও পাঠানো
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', uploadPreset);

            const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.secure_url) {
                statusText.innerText = "ডাটাবেজে তথ্য সংরক্ষণ করা হচ্ছে...";

                // ২. Firebase Firestore-এর "videos" কাইলেকশনে ভিডিও লিংক ও তথ্যাদি সেভ করা
                await addDoc(collection(db, "videos"), {
                    userId: user ? user.uid : "anonymous",
                    userName: user ? (user.displayName || "User") : "Anonymous User",
                    userPhoto: user ? (user.photoURL || "user.png") : "user.png",
                    videoUrl: data.secure_url,
                    caption: caption,
                    createdAt: serverTimestamp()
                });

                statusText.innerText = "সফলভাবে শেয়ার করা হয়েছে!";
                
                // ৩. কাজ শেষে ভিডিও পেজে চলে যাওয়া
                setTimeout(() => {
                    window.location.href = 'vedio.html';
                }, 1000);

            } else {
                statusText.innerText = "আপলোড ব্যর্থ হয়েছে!";
                btnShare.disabled = false;
            }
        } catch (error) {
            console.error("Upload Error:", error);
            statusText.innerText = "সমস্যা হয়েছে: " + error.message;
            btnShare.disabled = false;
        }
    });
</script>
</body>
