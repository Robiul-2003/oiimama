<body>
    <i class="fa-solid fa-angle-left" onclick="window.location='index.html'"> <span> Menu </span></i>
    <h2 onclick="window.location='add.html'"  data-i18n="addProduct">📦 Add product</h2>
     <h2 onclick="window.location='user.html'"   data-i18n="video">Video</h2>  
    <h2 onclick="window.location.href='user.html'" data-i18n="post">📝 Post</h2>
    <div class="soja">
      <h2 onclick="window.location.href='message.html'"  data-i18n="chat">💬 Chat</h2>
      <h2  data-i18n="notifications">🔔 Notifications</h2>
    </div>
    <h2 onclick="window.location ='https://adarshaagent.com/'"  data-i18n="service">🎰 Service</h2>
    <h2 onclick="settingsopen()" data-i18n="settings">⚙️ Settings</h2>
    <div id="setting">
      <p id="settingclose" onclick="settingclose()">X</p>
      <div class="color">
    <label>
        <input type="checkbox" id="darkToggle">
        Dark mode
    </label>
</div><br>
     <div class="language">
    <label for="languageSelect" data-i18n="language">
        Language:
    </label>

    <select id="languageSelect">
        <option value="bn">বাংলা</option>
        <option value="en">English</option>
    </select>
</div>
    </div>
    <h2 onclick="window.location ='about.html'"  data-i18n="about">📖 About Us</h2>
    <h2 onclick="window.location ='contact.html'"  data-i18n="contact">📩 Contact Us</h2>
    <h2 onclick="window.location ='privacy.html'"  data-i18n="privacy">🔒 Privacy Policy</h2>
  
    <h2 onclick="window.location ='login.html'"  data-i18n="login">📱 Login</h2>
    <h2 onclick="window.location ='signin.html'"  data-i18n="signIn">📲 Sign in</h2>
    <script>
       function settingsopen(){
        document.getElementById('setting').style.display ='block';
       }
         function settingclose(){
        document.getElementById('setting').style.display ='none';
       }
       
       const darkToggle = document.getElementById('darkToggle');

darkToggle.addEventListener('change', function () {
    document.body.classList.toggle('dark-mode', this.checked);
    localStorage.setItem('darkMode', this.checked);
});

// আগে Dark mode চালু করা থাকলে সেটি ফিরিয়ে আনবে
darkToggle.checked = localStorage.getItem('darkMode') === 'true';
document.body.classList.toggle('dark-mode', darkToggle.checked);


const translations = {
    en: {
        language: "Language:",
        menu: "Menu",
        addProduct: "📦 Add product",
        video: "Video",
        post: "📝 Post",
        chat: "💬 Chat",
        notifications: "🔔 Notifications",
        service: "🎰 Service",
        settings: "⚙️ Settings",
        darkMode: "Dark mode",
        login: "📱 Login",
        signIn: "📲 Sign in"
    },

    bn: {
        language: "ভাষা:",
        menu: "মেনু",
        addProduct: "📦 পণ্য যোগ করুন",
        video: "ভিডিও",
        post: "📝 পোস্ট",
        chat: "💬 চ্যাট",
        notifications: "🔔 বিজ্ঞপ্তি",
        service: "🎰 সার্ভিস",
        settings: "⚙️ সেটিংস",
        darkMode: "ডার্ক মোড",
        login: "📱 লগইন",
        signIn: "📲 সাইন আপ"
    }
};

function applyLanguage(lang) {
    const selected = translations[lang] || translations.en;

    document.documentElement.lang = lang;

    document.querySelectorAll("[data-i18n]").forEach(element => {
        const key = element.dataset.i18n;

        if (selected[key] !== undefined) {
            element.textContent = selected[key];
        }
    });

    localStorage.setItem("appLanguage", lang);
}

document.addEventListener("DOMContentLoaded", () => {
    const languageSelect = document.getElementById("languageSelect");
    const savedLanguage = localStorage.getItem("appLanguage") || "en";

    applyLanguage(savedLanguage);

    if (languageSelect) {
        languageSelect.value = savedLanguage;

        languageSelect.addEventListener("change", () => {
            applyLanguage(languageSelect.value);
        });
    }
});



    </script>
