<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adarsha BD - Admin Products</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f3f6;
}
header {
  background: #031f50;
  color: white;
  padding: 18px;
  text-align: center;
}
.container {
  max-width: 900px;
  margin: 20px auto;
  padding: 15px;
}
#adminPanel {
  display: none;
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}
input, textarea, button {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border-radius: 7px;
  border: 1px solid #ddd;
  font-size: 15px;
}
button {
  background: #031f50;
  color: white;
  border: none;
  cursor: pointer;
}
button:disabled {
  opacity: .6;
}
#productList {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
  gap: 15px;
}
.product {
  background: white;
  border-radius: 10px;
  padding: 12px;
  overflow: hidden;
}
.product img {
  width: 100%;
  height: 170px;
  object-fit: cover;
  border-radius: 7px;
}
.delete {
  background: #dc2626;
}
#status {
  text-align: center;
  padding: 12px;
}
</style>
</head>

<body>

<header>
  <h2>ADARSHA BD</h2>
  <p>Product Store</p>
</header>

<div class="container">

  <div id="status">Checking account...</div>

  <!-- Admin Only -->
  <section id="adminPanel">
    <h2>Admin Product Panel</h2>

    <form id="productForm">

      <input id="productName"
        placeholder="Product Name" required>

      <input id="productPrice"
        type="number" min="0"
        placeholder="Product Price" required>

      <input id="productCategory"
        placeholder="Product Category" required>

      <input id="productImage"
        type="url"
        placeholder="Product Image URL" required>

      <textarea id="productDetails"
        placeholder="Product Details"></textarea>

      <button id="addButton" type="submit">
        Add Product
      </button>

    </form>
  </section>

  <h2>All Products</h2>

  <div id="productList">
    Loading Products...
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  serverTimestamp,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


// 1. Firebase Configuration
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "robiul-84377.firebaseapp.com",
  projectId: "robiul-84377",
  storageBucket: "robiul-84377.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


// 2. Admin UID
const ADMIN_UID = "YOUR_ADMIN_UID";

const adminPanel = document.getElementById("adminPanel");
const productList = document.getElementById("productList");
const statusBox = document.getElementById("status");
const productForm = document.getElementById("productForm");
const addButton = document.getElementById("addButton");

let currentUser = null;


// 3. Authentication
onAuthStateChanged(auth, async (user) => {

  currentUser = user;

  const isAdmin =
    user !== null && user.uid === ADMIN_UID;

  adminPanel.style.display =
    isAdmin ? "block" : "none";

  statusBox.textContent = isAdmin
    ? "Admin Account"
    : user
      ? "Visitor Account - View Only"
      : "Guest - View Only";

  await loadProducts(isAdmin);

});


// 4. Add Product
productForm.addEventListener("submit", async (e) => {

  e.preventDefault();

  if (!currentUser ||
      currentUser.uid !== ADMIN_UID) {
    alert("Permission denied!");
    return;
  }

  const name =
    document.getElementById("productName").value.trim();

  const price =
    Number(document.getElementById("productPrice").value);

  const category =
    document.getElementById("productCategory").value.trim();

  const image =
    document.getElementById("productImage").value.trim();

  const details =
    document.getElementById("productDetails").value.trim();

  if (!name || !category || !image ||
      !Number.isFinite(price) || price < 0) {
    alert("Please enter valid product information.");
    return;
  }

  addButton.disabled = true;

  try {

    await addDoc(collection(db, "products"), {

      name: name,
      price: price,
      category: category,
      images: [image],
      details: details,

      userId: currentUser.uid,

      createdAt: serverTimestamp()

    });

    alert("Product Added Successfully!");

    productForm.reset();

    await loadProducts(true);

  } catch (error) {

    console.error(error);
    alert("Product Add Failed: " + error.message);

  } finally {
    addButton.disabled = false;
  }

});


// 5. Load All Products
async function loadProducts(isAdmin) {

  productList.textContent = "Loading...";

  try {

    const q = query(
      collection(db, "products"),
      orderBy("createdAt", "desc")
    );

    const snapshot = await getDocs(q);

    productList.innerHTML = "";

    if (snapshot.empty) {
      productList.textContent = "No Products Found.";
      return;
    }

    snapshot.forEach((item) => {

      const p = item.data();

      const card = document.createElement("div");
      card.className = "product";

      const img = document.createElement("img");
      img.src = p.images?.[0] || "logo.png";
      img.alt = p.name || "Product";
      img.onerror = () => {
        img.src = "logo.png";
      };

      const name = document.createElement("h3");
      name.textContent = p.name || "Product";

      const price = document.createElement("h3");
      price.textContent = "৳" + (p.price ?? 0);

      const category = document.createElement("p");
      category.textContent = p.category || "";

      const details = document.createElement("p");
      details.textContent = p.details || "";

      card.append(img, name, price, category, details);

      // Admin can delete only their own products
      if (isAdmin && p.userId === ADMIN_UID) {

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete";
        deleteBtn.textContent = "Delete Product";

        deleteBtn.onclick = async () => {

          if (!confirm("Are you sure you want to delete?")) {
            return;
          }

          try {

            await deleteDoc(
              doc(db, "products", item.id)
            );

            card.remove();

          } catch (error) {

            console.error(error);
            alert("Delete Failed!");

          }

        };

        card.appendChild(deleteBtn);

      }

      productList.appendChild(card);

    });

  } catch (error) {

    console.error(error);
    productList.textContent =
      "Unable to load products. Check Firebase Rules.";

  }

}

</script>

</body>
</html>
