<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADARSHA BD Payment</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 12px;
  font-family: Arial, sans-serif;
  background: #f1f4f9;
  color: #172033;
}

#box {
  max-width: 420px;
  margin: auto;
  padding: 22px;
  background: white;
  border-radius: 18px;
  box-shadow: 0 5px 24px #00000012;
}

.header {
  text-align: center;
  color: #031f50;
  margin-bottom: 22px;
}

.header h2 {
  margin-bottom: 5px;
}

.header p {
  color: #697386;
  font-size: 14px;
}

.methods {
  display: flex;
  gap: 12px;
  margin-bottom: 22px;
}

.method {
  flex: 1;
  border: 2px solid #e1e6ee;
  border-radius: 12px;
  padding: 12px;
  background: white;
  cursor: pointer;
}

.method img {
  width: 55px;
  height: 55px;
  object-fit: contain;
}

.method span {
  display: block;
  margin-top: 8px;
  font-weight: bold;
}

.method.active {
  border-color: #031f50;
  background: #f0f5ff;
}

.info {
  padding: 14px;
  background: #f5f7fb;
  border-radius: 12px;
  margin-bottom: 18px;
}

.info p {
  margin: 9px 0;
  overflow-wrap: anywhere;
}

#qrArea {
  text-align: center;
  display: none;
  margin-top: 20px;
}

#qr {
  width: 210px;
  max-width: 100%;
  height: auto;
  display: block;
  margin: 15px auto;
}

.note {
  font-size: 13px;
  color: #667085;
  line-height: 1.6;
}

label {
  display: block;
  font-weight: bold;
  margin: 15px 0 8px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #d3d9e4;
  border-radius: 9px;
  font-size: 15px;
}

.submit {
  width: 100%;
  border: none;
  background: #031f50;
  color: white;
  padding: 14px;
  border-radius: 10px;
  font-size: 16px;
  margin-top: 18px;
  cursor: pointer;
}

#message {
  font-size: 14px;
  line-height: 1.5;
}
.qrcode{

}
</style>
</head>

<body>
<div id="box">

  <div class="header">
    <h2>ADARSHA BD</h2>
    <p>Secure Payment</p>
  </div>

  <div class="methods">
    <button class="method" id="bkBtn" onclick="selectMethod('bkash')">
      <img src="bkash.png" alt="bKash">
      <span>bKash</span>
    </button>

    <button class="method" id="ngBtn" onclick="selectMethod('nagad')">
      <img src="nagad.png" alt="Nagad">
      <span>Nagad</span>
    </button>
  </div>

 <div class="info">
  <p>Name: <span id="userName">Loading...</span></p>
  <p>Amount: <span id="amount">0</span> ৳</p>
  <p>Views: <span id="views">0</span></p>
  <p>Product Name: <span id="productName">-</span></p>
</div>

  <div id="qrArea">
    <h3 id="methodTitle">Payment QR Code</h3>

    <img id="qr" src="bkashQRCODE.jpeg" alt="Payment QR Code">
     <img src="bkashQRCODE.jpeg" alt="" class="qrcode">
    <p class="note">
      QR Code স্ক্যান করে পেমেন্ট করুন।
      পেমেন্ট করার আগে সঠিক প্রাপক ও টাকার পরিমাণ নিশ্চিত করুন।
    </p>

    <label for="trxId">Transaction ID</label>
    <input id="trxId" type="text" placeholder="আপনার Transaction ID লিখুন">

    <button class="submit" onclick="submitPayment()">
      Payment Submitted
    </button>

    <p id="message" role="status"></p>
  </div>

</div>

<script>
let selectedMethod = "";

function selectMethod(method) {
  selectedMethod = method;

  document.getElementById("bkBtn")
    .classList.toggle("active", method === "bkash");

  document.getElementById("ngBtn")
    .classList.toggle("active", method === "nagad");

  document.getElementById("qrArea").style.display = "block";

  document.getElementById("methodTitle").textContent =
    method === "bkash"
      ? "bKash Payment QR"
      : "Nagad Payment QR";

  const qr = document.getElementById("qr");

  qr.src = method === "bkash"
      ? "bkash-qr.png"
      : "nagad-qr.png";

  qr.onerror = function() {
    this.style.display = "none";
    document.getElementById("message").textContent =
      "QR Code ছবি পাওয়া যায়নি। ছবির নাম ও Folder চেক করুন।";
  };

  qr.onload = function() {
    this.style.display = "block";
  };

  document.getElementById("message").textContent = "";
}

function submitPayment() {
  const trxId = document.getElementById("trxId").value.trim();

  if (!selectedMethod) {
    alert("প্রথমে bKash অথবা Nagad নির্বাচন করুন।");
    return;
  }

  if (!trxId) {
    alert("Transaction ID লিখুন।");
    return;
  }

  document.getElementById("message").textContent =
    "আপনার Payment Request জমা দেওয়ার জন্য প্রস্তুত। " +
    "বাস্তব ব্যবহারের আগে নিরাপদ সার্ভার ও পেমেন্ট যাচাই যুক্ত করতে হবে।";
}

document.getElementById("userName").textContent = "Loading from Firebase...";
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyB9Ed_6mJEZ_fhITCrf-d9P6KlgpQBLD14",
    authDomain: "robiul-84377.firebaseapp.com",
    projectId: "robiul-84377",
    storageBucket: "robiul-84377.firebasestorage.app",
    messagingSenderId: "476907665212",
    appId: "1:476907665212:web:874ccf5a0f2825f71b1039"
 };

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const nameEl = document.getElementById("userName");

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    nameEl.textContent = "Guest User";
    return;
  }

  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) {
      nameEl.textContent = snap.data().name || user.displayName || "User";
    } else {
      nameEl.textContent = user.displayName || "User";
    }
  } catch (err) {
    console.error("Name load error:", err);
    nameEl.textContent = user.displayName || "User";
  }
});

const params = new URLSearchParams(window.location.search);

const amount = parseInt(params.get("amount"), 10);
const views  = parseInt(params.get("views"), 10);
const productName =
  params.get("productName") ||
  localStorage.getItem("selectedProductName") ||
  "-";

const amountEl = document.getElementById("amount");
const viewsEl  = document.getElementById("views");

if (!isNaN(amount)) {
  amountEl.textContent = amount.toLocaleString();
}

if (!isNaN(views)) {
  viewsEl.textContent = views.toLocaleString();
}

document.getElementById("productName").textContent = productName;
</script>
</body>
</html>
