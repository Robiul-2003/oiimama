    if(value === null || value === undefined){
        return "";

// ================= LOAD POSTS =================
function makePostLinks(text) {

    // HTML Safe করা (XSS Prevention)
    text = escapeHTML(text);

    // ১. http:// বা https:// সহ URL
    text = text.replace(
        /(https?:\/\/[^\s<]+?)([.,!?)]?)(?=\s|$)/gi,
        '<a href="$1" target="_blank" rel="noopener noreferrer" class="hashtag-link">$1</a>$2'
    );

    // ২. www. দিয়ে শুরু হওয়া URL (যদি http/https না থাকে)
    text = text.replace(
        /(^|[^\/])(www\.[^\s<]+?)([.,!?)]?)(?=\s|$)/gi,
        '$1<a href="http://$2" target="_blank" rel="noopener noreferrer" class="hashtag-link">$2</a>$3'
    );

    // ৩. Hashtag (#)
    text = text.replace(
        /#(?!www\.)(?![a-zA-Z0-9_-]+\.[a-zA-Z]{2,})([a-zA-Z0-9_\u0980-\u09FF]+)/gi,
        '<a class="hashtag-link" href="hashtag.html?tag=$1" class="hashtag-link">#$1</a>'
    );

    return text;
}

/* =========== CLOUDINARY CONFIG============================= */
const CLOUD_NAME = "sykfzqhs"; // Cloudinary থেকে আপনার Cloud Name বসান
const UPLOAD_PRESET = "robiul_preset"; // Unsigned Upload Preset এর নাম বসান

/* =============== UPLOAD VIDEO TO CLOUDINARY & SAVE TO FIRES================================== */
const uploadBtn = document.getElementById("btnop");

if (uploadBtn) {
    uploadBtn.addEventListener("click", async () => {
        const videoInput = document.getElementById("videoInput");
        const captionText = document.getElementById("captionText");
        const status = document.getElementById("status");

        const file = videoInput.files[0];
        const caption = captionText.value.trim();

        if (!file) {
            alert("অনুগ্রহ করে একটি ভিডিও ফাইল সিলেক্ট করুন।");
            return;
        }

        const user = auth.currentUser;
        if (!user) {
            alert("আগে Login করুন।");
            return;
        }

        try {
            status.textContent = "Uploading video...";

            // 1. Get User Name from Firestore
            let userName = user.displayName || "User";
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {
                userName = userSnap.data().name || userName;
            }

            // 2. Upload Video to Cloudinary
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", UPLOAD_PRESET);

            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
                method: "POST",
                body: formData
            });

            const cloudinaryData = await res.json();

            if (!res.ok) {
                throw new Error(cloudinaryData.error?.message || "Cloudinary Upload Failed");
            }

            const videoUrl = cloudinaryData.secure_url;

            // 3. Save Data to Firestore "videos" Collection
            status.textContent = "Saving details";

            await addDoc(collection(db, "videos"), {
                videoUrl: videoUrl,
                caption: caption,
                userId: user.uid,
                userName: userName,
                createdAt: serverTimestamp()
            });

            status.textContent = "Video uploaded successfully!";
            captionText.value = "";
            videoInput.value = "";

            alert("Video Uploaded Successfully!");
            displayVideos(); // Refresh Video List

        } catch (error) {
            console.error("Video Upload Error:", error);
            status.textContent = "Upload Failed!";
            alert("Upload Failed: " + error.message);
        }
    });
}

/* ================ share button ====================== */
window.shareContent = async function(title, text, url) {
  try {
    // Web Share API support check (Mobile Browsers & WebView)
    if (navigator.share) {
      await navigator.share({
        title: title || 'Check this out!',
        text: text || '',
        url: url
      });
      return;
    }

    // Capacitor Native Share (Android/iOS App fallback)
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share) {
      await window.Capacitor.Plugins.Share.share({
        title: title,
        text: text,
        url: url,
        dialogTitle: "Share Content"
      });
      return;
    }

    // Fallback for Desktop Browsers (Clipboard Copy)
    if (navigator.clipboard) {
      await navigator.clipboard.writeText(url);
      alert("Link copied to clipboard!");
      return;
    }

    alert("Sharing is not supported on this browser.");

  } catch (error) {
    // User share cancel করলে AbortError আসে, যা ইগনোর করা ভালো
    if (error.name !== 'AbortError') {
      console.error("Share Error:", error);
    }
  }
};
