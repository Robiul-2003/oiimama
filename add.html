<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Product - Our Solution</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212; 
            color: #fff;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 650px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        .brand-title {
            color: #007bff;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .developer-tag {
            color: #aaa;
            font-size: 13px;
        }

        .developer-name {
            color: #28a745;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #bbb;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #007bff;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .image-slot {
            position: relative;
            width: 100%;
            aspect-ratio:1/1;
            padding-top: 100%; 
            background-color: #2d2d2d;
            border-radius: 10px;
            border: 1px solid #3a3a3a;
            overflow: hidden;
            cursor: pointer;
        }

        .slot-number {
            position: absolute;
            top: 8px;
            left: 8px;
            background-color: #0b2f61;
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            z-index: 2;
        }

        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: #581515;
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: none; 
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            z-index: 3;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background-color: #8a1f1f;
        }

        .image-slot img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .upload-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 20px;
            pointer-events: none;
        }

        .btn-submit {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #218838;
        }
        .btn-submit:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h2 class="brand-title">OUR SOLUTION</h2>
        <p class="developer-tag">Product Panel | Developer: <span class="developer-name">Robiul</span></p>
    </div>

    <form id="productForm">
        <div class="form-group">
            <label for="productName">Product Name *</label>
            <input type="text" id="productName" placeholder="Product Name" required>
        </div>
        <div class="form-group">
            <label for="Color">Product Color *</label>
            <input type="text" id="Color" placeholder="Color" required>
        </div>
        <div class="form-group">
            <label for="Size">Product Size *</label>
            <input type="text" id="Size" placeholder="Size" required>
        </div>
        <div class="form-group">
            <label for="productprice">Product Price *</label>
            <input type="number" id="productprice" placeholder="Price" required>
        </div>
        <div class="form-group">
            <label for="Whatsappnumber">Whatsapp Number *</label>
            <input type="text" id="Whatsappnumber" placeholder="01XXXXXXXXX" required>
        </div>
        <div class="form-group">
            <label for="productCategory">Category *</label>
            <select id="productCategory" required>
                <option value="" disabled selected>Select a category</option>
                <option value="clothing">Clothing & Fashion</option>
                <option value="electronics">Electronics</option>
                <option value="gadget">Gadget</option>
                <option value="Man">Man</option>
                <option value="Woman">Woman</option>
                <option value="Mobile">Mobile</option>
                <option value="Laptop">Laptop</option>
                <option value="Cars">Cars</option>
                <option value="Baby">Baby</option>
                <option value="Kitchen">Kitchen</option>
                <option value="accessories">Accessories</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label>Product Images (Up to 5)</label>
            <div class="image-grid">
                <div class="image-slot" onclick="triggerInput(1)">
                    <div class="slot-number">1</div>
                    <div class="delete-btn" id="delete-1" onclick="deleteImage(event, 1)">X</div>
                    <span class="upload-icon" id="icon-1">+</span>
                    <img id="img-1" alt="Preview">
                    <input type="file" id="input-1" accept="image/*" style="display: none;" onchange="previewSlotImage(this, 1)">
                </div>
                <div class="image-slot" onclick="triggerInput(2)">
                    <div class="slot-number">2</div>
                    <div class="delete-btn" id="delete-2" onclick="deleteImage(event, 2)">X</div>
                    <span class="upload-icon" id="icon-2">+</span>
                    <img id="img-2" alt="Preview">
                    <input type="file" id="input-2" accept="image/*" style="display: none;" onchange="previewSlotImage(this, 2)">
                </div>
                <div class="image-slot" onclick="triggerInput(3)">
                    <div class="slot-number">3</div>
                    <div class="delete-btn" id="delete-3" onclick="deleteImage(event, 3)">X</div>
                    <span class="upload-icon" id="icon-3">+</span>
                    <img id="img-3" alt="Preview">
                    <input type="file" id="input-3" accept="image/*" style="display: none;" onchange="previewSlotImage(this, 3)">
                </div>
                <div class="image-slot" onclick="triggerInput(4)">
                    <div class="slot-number">4</div>
                    <div class="delete-btn" id="delete-4" onclick="deleteImage(event, 4)">X</div>
                    <span class="upload-icon" id="icon-4">+</span>
                    <img id="img-4" alt="Preview">
                    <input type="file" id="input-4" accept="image/*" style="display: none;" onchange="previewSlotImage(this, 4)">
                </div>
                <div class="image-slot" onclick="triggerInput(5)">
                    <div class="slot-number">5</div>
                    <div class="delete-btn" id="delete-5" onclick="deleteImage(event, 5)">X</div>
                    <span class="upload-icon" id="icon-5">+</span>
                    <img id="img-5" alt="Preview">
                    <input type="file" id="input-5" accept="image/*" style="display: none;" onchange="previewSlotImage(this, 5)">
                </div>
            </div>
        </div>
        <div class="form-group">
            <label for="productDescription">Description *</label>
            <input type="text" id="productDescription" placeholder="Product Description..." required>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Add Product</button>
    </form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const CLOUDINARY_CLOUD_NAME = "sykfzqhs";
const CLOUDINARY_UPLOAD_PRESET = "robiul_preset";

const firebaseConfig = {
    apiKey: "AIzaSyB9Ed_6mJEZ_fhITCrf-d9P6KlgpQBLD14",
    authDomain: "robiul-84377.firebaseapp.com",
    projectId: "robiul-84377",
    storageBucket: "robiul-84377.firebasestorage.app",
    messagingSenderId: "476907665212",
    appId: "1:476907665212:web:874ccf5a0f2825f71b1039"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;

onAuthStateChanged(auth, (user) => {
    if(user){
        currentUser = user;
    } else {
        currentUser = null;
    }
});

// IMAGE PREVIEW FUNCTIONS
window.triggerInput = function(id){
    document.getElementById("input-"+id).click();
}

window.previewSlotImage = function(input, id){
    const file = input.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = function(e){
        document.getElementById("img-"+id).src = e.target.result;
        document.getElementById("img-"+id).style.display = "block";
        document.getElementById("icon-"+id).style.display = "none";
        document.getElementById("delete-"+id).style.display = "flex";
    }
    reader.readAsDataURL(file);
}

window.deleteImage = function(event, id){
    event.stopPropagation();
    document.getElementById("input-"+id).value = "";
    document.getElementById("img-"+id).src = "";
    document.getElementById("img-"+id).style.display = "none";
    document.getElementById("icon-"+id).style.display = "block";
    document.getElementById("delete-"+id).style.display = "none";
}

// ⚡ IMAGE COMPRESSION FUNCTION (ছবির সাইজ ছোট করার ফাংশন)
function compressImage(file, maxWidth = 1000, quality = 0.7) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                let width = img.width;
                let height = img.height;

                // যদি ছবি ১০০০ পিক্সেলের চেয়ে বড় হয়, তবে অনুপাত ঠিক রেখে ছোট করা হবে
                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }

                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);

                // ছবির কোয়ালিটি ৭০% রেখে ফাইল ফরম্যাটে রূপান্তর
                canvas.toBlob((blob) => {
                    if (blob) {
                        const compressedFile = new File([blob], file.name, {
                            type: "image/jpeg",
                            lastModified: Date.now()
                        });
                        resolve(compressedFile);
                    } else {
                        reject(new Error("Compression failed"));
                    }
                }, "image/jpeg", quality);
            };
            img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
    });
}

// UPLOAD TO CLOUDINARY
async function uploadToCloudinary(file) {
    const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

    const res = await fetch(url, {
        method: "POST",
        body: formData
    });

    if (!res.ok) {
        throw new Error("Cloudinary image upload failed");
    }

    const data = await res.json();
    return data.secure_url;
}

// FORM SUBMISSION
document.getElementById("productForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    if(!currentUser){
        alert("Please login first to upload a product.");
        return;
    }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.innerText = "Compressing & Uploading images...";

    const productId = Date.now().toString();
    let imageUrls = [];

    try {
        for(let i = 1; i <= 5; i++){
            const input = document.getElementById("input-"+i);
            if(input.files && input.files[0]){
                const originalFile = input.files[0];
                
                // ⚡ আপলোড করার আগে ছবি কম্প্রেস করা হচ্ছে
                const compressedFile = await compressImage(originalFile);

                const uploadedUrl = await uploadToCloudinary(compressedFile);
                imageUrls.push(uploadedUrl);
            }
        }

        btn.innerText = "Saving product info...";

        let rawWhatsapp = String(document.getElementById("Whatsappnumber").value.trim()).replace(/\D/g, "");
        if (rawWhatsapp.startsWith("01")) {
            rawWhatsapp = "88" + rawWhatsapp;
        } else if (rawWhatsapp.startsWith("1")) {
            rawWhatsapp = "880" + rawWhatsapp;
        }

        const price = document.getElementById("productprice").value;

        const product = {
            id: productId,
            name: document.getElementById("productName").value.trim(),
            Whatsapp: rawWhatsapp,
            size: document.getElementById("Size").value.trim(),
            color: document.getElementById("Color").value.trim(),
            category: [
                document.getElementById("productCategory").value
            ],
            details: document.getElementById("productDescription").value.trim(),
            ppieces: ["1-5", "6-10", "11-20"],
            price: [
                price + " TK",
                price + " TK",
                price + " TK"
            ],
            images: imageUrls,
            userId: currentUser.uid,
            ownerEmail: currentUser.email || "",
            createdAt: serverTimestamp()
        };

        await setDoc(doc(db, "products", productId), product);

        alert("✅ Product Added Successfully!");

        document.getElementById("productForm").reset();
        for(let i = 1; i <= 5; i++){
            window.deleteImage({ stopPropagation: () => {} }, i);
        }

        if (window.history.length > 1) {
            window.history.back();
        } else {
            location.href = "index.html";
        }

    } catch (error) {
        console.error("Error:", error);
        alert("Error: " + error.message);
    } finally {
        btn.disabled = false;
        btn.innerText = "Add Product";
    }
});
</script>
</body>
</html>
