function renderProducts(productsToDisplay) {
  let box = document.getElementById("productList");
  if(!box) return;
  box.innerHTML = "";

  productsToDisplay.forEach(p => {
    let imgSrc = (p.images && p.images[0]) ? p.images[0] : 'logo.png';
    let displayPrice = Array.isArray(p.price) ? p.price[0] : (p.price + " TK");

    box.innerHTML += `

        <img src="${imgSrc}" alt="${p.name}">
        <p>${p.name}</p>
        <p class="pprice">${displayPrice}</p>
      </div>
    `;
  });
}

function searchProduct(){
  let input1 = document.getElementById("search") ? document.getElementById("search").value.toLowerCase().trim() : "";
  let input2 = document.getElementById("ONEsearch") ? document.getElementById("ONEsearch").value.toLowerCase().trim() : "";
  let input = input1 || input2;
  
  if (input === "") {
    renderProducts(window.allProducts);
    return;
  }

  let filtered = window.allProducts.filter(p => {
    let nameMatch = p.name ? p.name.toLowerCase().includes(input) : false;
    let codeMatch = p.code ? String(p.code).toLowerCase().includes(input) : false;
    return nameMatch || codeMatch;
  });
  
  renderProducts(filtered);
}

        if (String(item.id) === String(p.id)) {
            return;
        }

        const imgSrc =
            (item.images && item.images.length > 0)
            ? item.images[0]
            : "logo.png";

        const displayPrice =
            Array.isArray(item.price)
            ? item.price[0]
            : (item.price || "Price not available");

        const productCard = document.createElement("div");

        productCard.className = "product";

        productCard.innerHTML = `
            <img src="${imgSrc}" alt="${item.name}">
            <p>${item.name}</p>
            <p class="pprice">${displayPrice}</p>
        `;

        // Related product click
        productCard.addEventListener("click", function(e) {

            e.stopPropagation();

            openModal(item.id);

            // Product details-এর শুরুতে নিয়ে যাবে
            document.getElementById("modal").scrollTop = 0;

        });

        relatedBox.appendChild(productCard);
    });
}

function closeModal(){
   document.getElementById("modal").style.display="none"; 
     if (history.state && history.state.modal) {
        history.back();
    }
  }

function checkLogin(){
    let number = document.getElementById("number").value.trim();
    let pin = document.getElementById("pin").value.trim();
    if(number === "123456789" && pin === "2025"){
        window.location.href = "add.html";
    }else{
        alert("Wrong Number or PIN");
    }
}

function filterProducts(category){
  if(category === "all") {
    renderProducts(window.allProducts);
  } else {
    let filtered = window.allProducts.filter(p => {
      if(Array.isArray(p.category)){
        return p.category.includes(category);
      }
      return p.category === category;
    });
    renderProducts(filtered);
  }
}

function orderNow() {

    const p = window.currentProduct;

    if (!p) {
        alert("Product not found");
        return;
    }

    const whatsapp = String(p.Whatsapp || "").trim();

    if (!whatsapp) {
        alert("Seller WhatsApp Number Not Found");
        return;
    }

  const message = 
`🛒 New Order

📦 Product: ${p.name}
💰 Price: ${Array.isArray(p.price) ? p.price[0] : p.price}`;

  window.open(
    `https://wa.me/${whatsapp}?text=${encodeURIComponent(message)}`,
    "_blank"
  );
}
window.orderNow = orderNow;

async function loadFirebaseProducts() {
  try {
    const querySnapshot = await getDocs(collection(db, "products"));
    querySnapshot.forEach((doc) => {
      let p = doc.data();
      if(!p.id) p.id = doc.id; 
      if (!window.allProducts.some(x => String(x.id) === String(p.id))) {
         window.allProducts.push(p);
      }
    });
    renderProducts(window.allProducts);
  } catch (error) {
    console.error("Error loading products: ", error);
  }
}
window.addEventListener("popstate", function (e) {
    const modal = document.getElementById("modal");

    if (modal.style.display === "block") {
        modal.style.display = "none";
    }
});
 const banners = document.querySelectorAll(".banner");

let current = 0;

function showBanner() {

  banners.forEach(img => {
    img.classList.remove("active");
  });

  banners[current].classList.add("active");

  current++;

  if (current >= banners.length) {
    current = 0;
  }
}

showBanner();
